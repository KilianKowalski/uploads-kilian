<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Lea & Kilian – 1 Jahr ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  background: black;
  overflow: hidden;
  color: white;
  font-family: 'Inter', sans-serif;
}

/* PARTICLES */
canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
}

/* SCREENS */
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 2s ease;
  z-index: 2;
}

.screen.active {
  opacity: 1;
}

/* TEXT */
h1 {
  font-family: 'Playfair Display', serif;
  font-size: 4.5rem;
  letter-spacing: 3px;
}

h2 {
  font-family: 'Playfair Display', serif;
  margin-top: 20px;
  font-size: 2rem;
  opacity: 0.85;
}

.hint {
  position: absolute;
  bottom: 50px;
  font-size: 1rem;
  opacity: 0.6;
}

/* SLIDESHOW */
.slide {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 2.5s ease;
}

.slide.active {
  opacity: 1;
}

.slide .bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: blur(45px) brightness(0.55);
  transform: scale(1.15);
}

.slide .fg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* END */
#end h1 {
  font-size: 5.5rem;
}

#end p {
  margin-top: 30px;
  max-width: 750px;
  text-align: center;
  font-size: 1.15rem;
  opacity: 0.85;
}

/* HIDDEN FILE INPUT */
#folderInput {
  display: none;
}
</style>
</head>

<body>

<canvas id="particles"></canvas>
<input type="file" id="folderInput" webkitdirectory multiple accept="image/*">

<!-- START -->
<div id="start" class="screen active">
  <h1>Lea & Kilian</h1>
  <h2>1 Jahr ❤️</h2>
  <div class="hint">Leertaste drücken, um zu starten</div>
</div>

<!-- SLIDESHOW -->
<div id="slideshow" class="screen"></div>

<!-- END -->
<div id="end" class="screen">
  <h1>Ich liebe dich ❤️</h1>
  <p>
    Du kannst jetzt den Brief öffnen.<br><br>
    Tut mir leid, dass er nicht so lang geworden ist,<br>
    aber ich hoffe trotzdem, dass er dir gefällt.
  </p>
  <div class="hint">Leertaste drücken, um alles neu zu starten</div>
</div>

<script>
/* ================= PARTICLES ================= */
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

let particles = [];
let heartMode = false;

function resize() {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
addEventListener("resize", resize);
resize();

function createParticles() {
  particles = [];
  for (let i = 0; i < 140; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      s: Math.random() * 0.6 + 0.3,
      r: Math.random() * 1.8 + 0.8
    });
  }
}
createParticles();

function drawHeart(x, y, size) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(size, size);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.bezierCurveTo(-1, -1, -3, 1, 0, 3);
  ctx.bezierCurveTo(3, 1, 1, -1, 0, 0);
  ctx.fill();
  ctx.restore();
}

function animateParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => {
    p.y -= p.s;
    if (p.y < -20) {
      p.y = canvas.height + 20;
      p.x = Math.random() * canvas.width;
    }
    if (heartMode) {
      ctx.fillStyle = "rgba(255,80,120,0.85)";
      drawHeart(p.x, p.y, p.r);
    } else {
      ctx.fillStyle = "rgba(255,255,255,0.55)";
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
  });
  requestAnimationFrame(animateParticles);
}
animateParticles();

/* ================= SLIDESHOW ================= */
const SLIDE_DURATION = 5000;
let files = [];
let current = 0;
let interval;

function showScreen(id) {
  document.querySelectorAll(".screen")
    .forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function startSlideshow() {
  showScreen("slideshow");
  const container = document.getElementById("slideshow");
  container.innerHTML = "";

  files.forEach(file => {
    const url = URL.createObjectURL(file);
    const slide = document.createElement("div");
    slide.className = "slide";

    const bg = document.createElement("img");
    bg.src = url;
    bg.className = "bg";

    const fg = document.createElement("img");
    fg.src = url;
    fg.className = "fg";

    slide.appendChild(bg);
    slide.appendChild(fg);
    container.appendChild(slide);
  });

  const slides = container.querySelectorAll(".slide");
  current = 0;
  slides[current].classList.add("active");

  interval = setInterval(() => {
    slides[current].classList.remove("active");
    current++;
    if (current >= slides.length) {
      clearInterval(interval);
      setTimeout(() => {
        heartMode = true;
        showScreen("end");
      }, 2500);
      return;
    }
    slides[current].classList.add("active");
  }, SLIDE_DURATION);
}

/* ================= INPUT HANDLING ================= */
document.getElementById("folderInput").addEventListener("change", e => {
  files = [...e.target.files]
    .filter(f => f.type.startsWith("image/"))
    .sort((a, b) => a.name.localeCompare(b.name));

  if (files.length > 0) {
    startSlideshow();
  }
});

document.addEventListener("keydown", e => {
  if (e.key === "+") {
    document.getElementById("folderInput").click();
  }

  if (e.code === "Space") {
    if (document.getElementById("end").classList.contains("active")) {
      heartMode = false;
      showScreen("start");
    }
  }
});
</script>

</body>
</html>
