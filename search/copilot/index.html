<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Suche</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>

    body {
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #e8ecf3, #d7deea);
        font-family: "Inter", sans-serif;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
        padding-top: 120px;
        color: #222;
        animation: fadeIn 1s ease forwards;
        opacity: 0;
    }

    @keyframes fadeIn {
        to { opacity: 1; }
    }

    .container {
        width: min(600px, 90%);
        text-align: center;
        animation: slideUp 0.7s ease forwards;
        opacity: 0;
        transform: translateY(20px);
    }

    @keyframes slideUp {
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .search-box {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px);
        border-radius: 16px;
        padding: 14px 20px;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 10px 28px rgba(0,0,0,0.08);
        border: 1px solid rgba(255,255,255,0.6);
        transition: box-shadow .25s ease, transform .25s ease;
    }

    .search-box:focus-within {
        box-shadow: 0 14px 36px rgba(0,0,0,0.12);
        transform: translateY(-2px);
    }

    input {
        flex: 1;
        border: none;
        outline: none;
        font-size: 1.15rem;
        background: transparent;
        color: #222;
    }

    button {
        background: #111;
        color: white;
        border: none;
        padding: 10px 18px;
        border-radius: 12px;
        cursor: pointer;
        font-size: .9rem;
        transition: background .2s ease, transform .2s ease;
    }

    button:hover {
        background: #333;
        transform: translateY(-1px);
    }

    .history {
        margin-top: 22px;
        text-align: left;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity .4s ease, transform .4s ease;
    }

    .history.visible {
        opacity: 1;
        transform: translateY(0);
    }

    .history-title {
        font-size: .9rem;
        color: #555;
        margin-bottom: 8px;
        padding-left: 4px;
        font-weight: 500;
    }

    .history-item {
        background: rgba(255,255,255,0.65);
        backdrop-filter: blur(10px);
        padding: 12px 16px;
        border-radius: 14px;
        margin-bottom: 10px;
        cursor: pointer;
        border: 1px solid rgba(255,255,255,0.5);
        transition: background .2s ease, transform .15s ease;
        font-size: 1rem;
    }

    .history-item:hover {
        background: rgba(255,255,255,0.9);
        transform: translateX(6px);
    }

</style>
</head>
<body>

<div class="container">
    <div class="search-box">
        <input id="searchInput" type="text" placeholder="Suche starten…">
        <button id="searchBtn">Suchen</button>
    </div>

    <div id="history" class="history"></div>
</div>

<script>

    const input = document.getElementById("searchInput");
    const btn = document.getElementById("searchBtn");
    const historyBox = document.getElementById("history");

    function loadHistory() {
        const items = JSON.parse(localStorage.getItem("searchHistory") || "[]");

        if (items.length === 0) {
            historyBox.classList.remove("visible");
            historyBox.innerHTML = "";
            return;
        }

        historyBox.classList.add("visible");
        historyBox.innerHTML = `
            <div class="history-title">Letzte Suchanfragen</div>
            ${items.map(i => `<div class="history-item">${i}</div>`).join("")}
        `;

        document.querySelectorAll(".history-item").forEach(el => {
            el.addEventListener("click", () => {
                input.value = el.textContent;
            });
        });
    }

    function saveToHistory(query) {
        let items = JSON.parse(localStorage.getItem("searchHistory") || "[]");

        items = items.filter(i => i !== query);
        items.unshift(query);

        items = items.slice(0, 10);

        localStorage.setItem("searchHistory", JSON.stringify(items));
        loadHistory();
    }

    function search() {
        const q = input.value.trim();
        if (!q) return;

        saveToHistory(q);

        const url = "https://www.google.com/search?q=" + encodeURIComponent(q);
        window.open(url, "_blank");
    }

    btn.addEventListener("click", search);

    input.addEventListener("keydown", e => {
        if (e.key === "Enter") search();
    });

    loadHistory();

</script>

</body>
</html>
