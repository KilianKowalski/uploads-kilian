<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Jumper Pro</title>
    <style>
        body { margin: 0; background: #1a1a1a; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        #game-container { position: relative; }
        canvas { background: #fff; border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.5); display: block; }
        
        /* Eigenes Pop-up Design */
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); color: white; display: none;
            flex-direction: column; justify-content: center; align-items: center;
            border-radius: 8px; text-align: center;
        }
        button {
            padding: 10px 20px; font-size: 18px; cursor: pointer;
            background: #2ECC71; border: none; color: white; border-radius: 5px; margin-top: 15px;
        }
        button:hover { background: #27ae60; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    <!-- Das eigene Pop-up -->
    <div id="overlay">
        <h1 id="msg">GAME OVER</h1>
        <p>Dein Score: <span id="finalScore">0</span></p>
        <button onclick="resetGame()">Nochmal spielen</button>
    </div>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const overlay = document.getElementById("overlay");
    const finalScoreMsg = document.getElementById("finalScore");

    let player, platforms, score, gameOver, keys = {};

    function init() {
        score = 0;
        gameOver = false;
        overlay.style.display = "none";
        
        // Spieler startet sicher in der Mitte
        player = {
            x: 190, y: 400, size: 25,
            vy: 0, vx: 0,
            jumpStrength: -12, gravity: 0.5
        };

        // Erste Plattform direkt unter dem Spieler garantieren
        platforms = [{ x: 150, y: 500, w: 100, h: 15 }];
        
        // Restliche Plattformen zufällig verteilen
        for (let i = 0; i < 6; i++) {
            platforms.push({
                x: Math.random() * (canvas.width - 70),
                y: i * 90,
                w: 70, h: 15
            });
        }
    }

    window.addEventListener("keydown", e => keys[e.code] = true);
    window.addEventListener("keyup", e => keys[e.code] = false);

    function resetGame() {
        init();
        draw();
    }

    function update() {
        if (gameOver) return;

        if (keys["ArrowLeft"]) player.vx = -6;
        else if (keys["ArrowRight"]) player.vx = 6;
        else player.vx = 0;

        player.x += player.vx;
        player.vy += player.gravity;
        player.y += player.vy;

        // Rand-Teleport
        if (player.x < -20) player.x = canvas.width;
        if (player.x > canvas.width) player.x = -20;

        // Kollision beim Fallen
        if (player.vy > 0) {
            platforms.forEach(p => {
                if (player.x < p.x + p.w && player.x + player.size > p.x &&
                    player.y + player.size > p.y && player.y + player.size < p.y + p.h + 15) {
                    player.vy = player.jumpStrength;
                }
            });
        }

        // Kamera-Scroll und Punkte
        if (player.y < 250) {
            let diff = 250 - player.y;
            player.y = 250;
            platforms.forEach(p => {
                p.y += diff;
                if (p.y > canvas.height) {
                    p.y = 0;
                    p.x = Math.random() * (canvas.width - 70);
                    score++; // Punkt wenn Plattform verschwindet
                }
            });
        }

        // Game Over Check
        if (player.y > canvas.height) {
            gameOver = true;
            finalScoreMsg.innerText = score;
            overlay.style.display = "flex";
        }
    }

    function draw() {
        if (gameOver) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Spieler
        ctx.fillStyle = "#2ECC71";
        ctx.fillRect(player.x, player.y, player.size, player.size);

        // Plattformen
        ctx.fillStyle = "#34495E";
        platforms.forEach(p => {
            ctx.fillRect(p.x, p.y, p.w, p.h);
        });

        // Score Anzeige
        ctx.fillStyle = "#333";
        ctx.font = "bold 20px Arial";
        ctx.fillText("Score: " + score, 20, 40);

        update();
        requestAnimationFrame(draw);
    }

    init();
    draw();
</script>
</body>
</html>
