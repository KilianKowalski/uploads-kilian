<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MegaCraft</title>
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
    
    <!-- Minecraft Schrift -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <!-- Lesbare Schrift -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f2b47, #1a4a6e);
            color: #e0f7ff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
        }

        header img {
            max-width: 340px;
            height: auto;
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        header img:hover {
            transform: scale(1.06);
            filter: drop-shadow(0 0 15px #39BBC4);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }

        h1, .subtitle {
            font-family: 'Press Start 2P', cursive;
            color: #39BBC4;
            text-shadow: 4px 4px 0 #0d1f33, 6px 6px 0 #000;
            letter-spacing: 2px;
        }

        h1 {
            font-size: 2.8em;
            margin-bottom: 20px;
        }

        .subtitle {
            font-size: 1.1em;
            max-width: 780px;
            line-height: 1.6;
            margin-bottom: 40px;
            color: #d0f0ff;
        }

        footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 30px 20px;
            background: rgba(0, 0, 0, 0.6);
            font-family: 'Press Start 2P', cursive;
            font-size: 0.9em;
            color: #a0d0e0;
            text-shadow: 1px 1px 2px #000;
        }

        .footer-buttons {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        footer a button {
            padding: 14px 32px;
            font-size: 1em;
            font-family: 'Press Start 2P', cursive;
            background: #39BBC4;
            color: #0d1f33;
            border: 4px solid #2a9aa6;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 5px 0 #2a9aa6;
            text-shadow: 1px 1px 0 #fff8;
            min-width: 160px;
        }

        footer a button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 0 #1f7a80;
            background: #4acdd9;
        }

        .copyright {
            opacity: 0.9;
            margin-top: 6px;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.1em; }
            .subtitle { font-size: 0.95em; }
            header img { max-width: 240px; }
            footer { font-size: 0.8em; padding: 25px 15px; }
            footer a button { padding: 12px 24px; font-size: 0.9em; min-width: 140px; }
            .footer-buttons { gap: 16px; }
        }
    </style>
</head>
<body>
    <header>
        <img src="assets/logo.png" alt="MegaCraft Logo">
    </header>

    <main>
        <h1>Willkommen auf MegaCraft!</h1>
        <p class="subtitle">DEIN MINECRAFT SERVER<br>Der Server ist noch in Arbeit.</p>
    </main>

    <footer>
        <div class="footer-buttons">
            <a href="impressum.html"><button>Impressum</button></a>
            <a href="https://dc.megacraft.de" target="_blank" rel="noopener noreferrer"><button>Discord</button></a>
        </div>
        <div class="copyright">
            © <span id="year"></span> MegaCraft – Alle Rechte vorbehalten.
        </div>
    </footer>

    <script>
        document.getElementById("year").textContent = new Date().getFullYear();
    </script>
</body>
</html>
