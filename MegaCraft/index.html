<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MegaCraft Server</title>
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        header img {
            max-width: 300px; /* Passe die Breite an, da das Logo kein Quadrat ist – es behält sein Aspect Ratio */
            height: auto;
            transition: transform 0.3s ease;
        }

        header img:hover {
            transform: scale(1.05);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 50px 20px;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            animation: fadeIn 1s ease-in-out;
        }

        p {
            font-size: 1.2em;
            max-width: 800px;
            line-height: 1.6;
            animation: fadeIn 1.5s ease-in-out;
        }

        footer {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.2);
        }

        footer button {
            padding: 10px 20px;
            font-size: 1em;
            background: #ffffff;
            color: #1e3c72;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s ease, color 0.3s ease;
        }

        footer button:hover {
            background: #2a5298;
            color: #ffffff;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsives Design */
        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }
            p {
                font-size: 1em;
            }
            header img {
                max-width: 200px;
            }
        }
    </style>
</head>
<body>
    <header>
        <img src="assets/logo.png" alt="MegaCraft Logo">
    </header>
    <main>
        <h1>Willkommen auf dem MegaCraft Server!</h1>
        <p>Der Server ist derzeit noch in Arbeit und wird bald für spannende Games und weitere Features bereitstehen. Bleib dran – es wird episch!</p>
    </main>
    <footer>
        <a href="impressum.html"><button>Impressum</button></a>
    </footer>
</body>
</html>
