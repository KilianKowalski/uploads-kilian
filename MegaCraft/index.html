<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MegaCraft Server</title>
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
    
    <!-- Minecraft-ähnliche Schriftart (am populärsten & kostenlos über Google Fonts) -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <!-- Alternative sehr nah an Minecraft (Minecraftia-Font): -->
    <!-- <link href="https://fonts.cdnfonts.com/css/minecraftia" rel="stylesheet"> -->
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Press Start 2P', cursive;
            background: linear-gradient(135deg, #0f2b47, #1a4a6e);
            color: #e0f7ff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
        }

        header img {
            max-width: 340px;
            height: auto;
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        header img:hover {
            transform: scale(1.06);
            filter: drop-shadow(0 0 15px #39BBC4);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 2.8em;
            margin-bottom: 25px;
            color: #39BBC4;
            text-shadow: 4px 4px 0 #0d1f33, 6px 6px 0 #000;
            letter-spacing: 2px;
            animation: fadeIn 1.2s ease-out;
        }

        p {
            font-size: 1.1em;
            max-width: 780px;
            line-height: 1.7;
            color: #d0f0ff;
            text-shadow: 2px 2px 3px #000;
            animation: fadeIn 1.8s ease-out;
        }

        footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 25px;
            background: rgba(0, 0, 0, 0.6);
            font-size: 0.9em;
            color: #a0d0e0;
        }

        footer a button {
            padding: 12px 28px;
            font-size: 1em;
            font-family: 'Press Start 2P', cursive;
            background: #39BBC4;
            color: #0d1f33;
            border: 3px solid #2a9aa6;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 0 #2a9aa6;
        }

        footer a button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #1f7a80;
            background: #4acdd9;
        }

        .copyright {
            margin-top: 8px;
            opacity: 0.9;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.1em; }
            p { font-size: 0.95em; }
            header img { max-width: 240px; }
        }
    </style>
</head>
<body>
    <header>
        <img src="assets/logo.png" alt="MegaCraft Logo">
    </header>

    <main>
        <h1>Willkommen auf MegaCraft!</h1>
        <p>Der Server ist derzeit noch in der Entwicklung.<br>Es kommen bald richtig starke Games & Features – bleib gespannt!</p>
    </main>

    <footer>
        <a href="impressum.html"><button>Impressum</button></a>
        <div class="copyright">
            © <span id="year"></span> MegaCraft – Alle Rechte vorbehalten.
        </div>
    </footer>

    <script>
        document.getElementById("year").textContent = new Date().getFullYear();
    </script>
</body>
</html>
