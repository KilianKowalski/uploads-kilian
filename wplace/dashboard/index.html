<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wplace Antifa – Dashboard</title>

  <link rel="stylesheet" href="../assets/styles.css">
  <link rel="stylesheet" href="dashboard.css">
</head>

<body>
  <main class="container section">
    <h1>🛠️ Wplace Projekt-Dashboard</h1>
    <p class="muted">Internes Tool – nichts wird automatisch gespeichert.</p>

    <div class="panel">
      <h2 class="panel-title">Projekt</h2>
      <select id="projectSelect" class="select"></select>
      <button id="newProjectBtn" class="btn btn-secondary">➕ Neues Projekt</button>
      <div id="idStatus" class="status"></div>
    </div>

    <div class="panel">
      <h2 class="panel-title">Basisdaten</h2>

      <div class="form-grid">
        <input id="id" placeholder="Projekt-ID">
        <input id="title" placeholder="Titel">
        <select id="status">
          <option value="wip">In Arbeit</option>
          <option value="done">Fertig</option>
        </select>
        <input id="tags" placeholder="Tags (kommagetrennt)">
        <input id="coordUrl" placeholder="Koordinaten-URL">
        <input id="updatedAt" placeholder="Update-Datum">
      </div>
    </div>

    <div class="panel">
      <h2 class="panel-title">Bilder</h2>

      <button id="genImgPaths" class="btn btn-ghost">📁 Bildpfade generieren</button>

      <div class="form-grid">
        <input id="coverImg" placeholder="Cover-Bild">
        <input id="progressImg" placeholder="Progress-Bild">
        <input id="finalImg" placeholder="Final-Bild">
      </div>

      <div id="imgStatus" class="status"></div>
    </div>

    <div class="panel">
      <h2 class="panel-title">Texte</h2>
      <textarea id="note" placeholder="Kurz-Notiz"></textarea>
      <textarea id="wipText" placeholder="At-Work-Text"></textarea>
    </div>

    <div class="panel">
      <h2 class="panel-title">🔍 Vorschau</h2>
      <div class="preview-grid">
        <div id="previewCard"></div>
        <div id="previewWip"></div>
      </div>
    </div>

    <div class="panel actions">
      <button id="generateBlock" class="btn btn-secondary">📋 Codeblock</button>
      <button id="generateFull" class="btn btn-primary">📦 Ganze data.js</button>
      <a id="repoBtn" class="btn btn-ghost" target="_blank">🔗 GitHub</a>
    </div>

    <div id="projectStatus" class="panel status"></div>

    <pre id="output" class="panel"></pre>
  </main>

  <script src="../assets/data.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
