<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Wplace Antifa – Projekte</title>

  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="assets/styles.css" />
</head>

<body>

  <!-- Consent Overlay -->
  <div id="consentOverlay" class="consent-overlay"></div>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <span class="brand-text">Wplace Antifa</span>
      </a>

      <nav class="nav">
        <a class="nav-link" href="index.html">Start</a>
        <a class="nav-link active" href="projekte.html">Projekte</a>
      </nav>

      <button class="btn btn-ghost" id="themeToggle">🌙/☀️</button>
    </div>
  </header>

  <main class="container section">
    <div class="section-head">
      <h1>Projekte</h1>
      <p class="muted">
        Laufende und fertige Projekte – neueste zuerst.
      </p>
    </div>

    <!-- 🔍 Suche & Filter -->
    <div class="panel">
      <div class="toolbar">
        <div class="search">
          <input id="searchProjects" type="search"
                 placeholder="Suchen (Titel, Text, Tags)…">
        </div>

        <select id="filterStatus" class="select">
          <option value="all">Alle Projekte</option>
          <option value="wip">Nur in Arbeit</option>
          <option value="done">Nur fertig</option>
        </select>
      </div>
    </div>

    <div id="projectsList" class="post-list">
      <!-- JS rendert hier -->
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-left">
        <b>Wplace Antifa</b>
        <div class="muted small">Projektübersicht</div>
      </div>
      <div class="footer-right small muted">
        <span id="year"></span>
      </div>
    </div>
  </footer>

  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
