<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roller Ölverbrauch Tracker</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
    background:#111827;
    color:white;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
}

h1{
    margin-bottom:20px;
    text-align:center;
}

.card{
    background:#1f2937;
    border-radius:16px;
    padding:20px;
    margin-bottom:20px;
}

input, textarea{
    width:100%;
    padding:12px;
    margin-top:8px;
    margin-bottom:12px;
    border:none;
    border-radius:10px;
    background:#374151;
    color:white;
}

textarea{
    resize:vertical;
}

button{
    border:none;
    border-radius:10px;
    padding:12px 18px;
    cursor:pointer;
    margin:5px;
    font-weight:bold;
}

.primary{
    background:#3b82f6;
    color:white;
}

.danger{
    background:#ef4444;
    color:white;
}

.secondary{
    background:#10b981;
    color:white;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
}

.stat{
    background:#374151;
    border-radius:12px;
    padding:15px;
}

table{
    width:100%;
    border-collapse:collapse;
    overflow-x:auto;
}

th,td{
    padding:10px;
    text-align:left;
    border-bottom:1px solid #374151;
}

canvas{
    background:white;
    border-radius:12px;
    padding:10px;
}

label{
    display:block;
    margin-top:10px;
}

.checkbox{
    width:auto;
    transform:scale(1.4);
    margin-right:10px;
}
</style>
</head>
<body>

<div class="container">

<h1>🛵 Roller Ölverbrauch Tracker</h1>

<div class="card">
<h2>Neuer Eintrag</h2>

<label>Datum</label>
<input type="date" id="datum">

<label>Kilometerstand</label>
<input type="number" id="km">

<label>Nachgefülltes Öl (ml)</label>
<input type="number" id="oel">

<label>
<input type="checkbox" id="warn" class="checkbox">
Rote Warnleuchte hat geleuchtet
</label>

<label>Notiz</label>
<textarea id="notiz"></textarea>

<button class="primary" onclick="addEntry()">Speichern</button>
</div>

<div class="card">
<h2>Statistik</h2>

<div class="stats">
<div class="stat">
<h3 id="gesamtOel">0 ml</h3>
<p>Gesamt Öl</p>
</div>

<div class="stat">
<h3 id="gesamtKm">0 km</h3>
<p>Gefahren</p>
</div>

<div class="stat">
<h3 id="verbrauch">0</h3>
<p>ml / 100 km</p>
</div>

<div class="stat">
<h3 id="warnungen">0</h3>
<p>Warnleuchten</p>
</div>
</div>
</div>

<div class="card">
<h2>Diagramm</h2>
<canvas id="chart"></canvas>
</div>

<div class="card">
<h2>Einträge</h2>

<table>
<thead>
<tr>
<th>Datum</th>
<th>KM</th>
<th>Öl</th>
<th>Warnung</th>
<th>Notiz</th>
<th></th>
</tr>
</thead>

<tbody id="tableBody"></tbody>
</table>
</div>

<div class="card">
<h2>Daten</h2>

<button class="secondary" onclick="exportData()">Exportieren</button>

<input type="file" id="importFile">

<button class="primary" onclick="importData()">Importieren</button>
</div>

</div>

<script>

let entries = JSON.parse(localStorage.getItem("rollerOilData")) || [];

document.getElementById("datum").value =
new Date().toISOString().split("T")[0];

function saveData(){
    localStorage.setItem(
        "rollerOilData",
        JSON.stringify(entries)
    );
}

function addEntry(){

    const entry = {
        datum: document.getElementById("datum").value,
        km: Number(document.getElementById("km").value),
        oel: Number(document.getElementById("oel").value),
        warn: document.getElementById("warn").checked,
        notiz: document.getElementById("notiz").value
    };

    if(!entry.km || !entry.oel){
        alert("Bitte KM und Ölmenge eingeben.");
        return;
    }

    entries.push(entry);

    entries.sort((a,b)=>a.km-b.km);

    saveData();
    render();
}

function deleteEntry(index){

    if(confirm("Eintrag löschen?")){
        entries.splice(index,1);
        saveData();
        render();
    }

}

function render(){

    const body = document.getElementById("tableBody");

    body.innerHTML="";

    entries.forEach((e,i)=>{

        body.innerHTML += `
        <tr>
            <td>${e.datum}</td>
            <td>${e.km}</td>
            <td>${e.oel} ml</td>
            <td>${e.warn ? "🔴" : "🟢"}</td>
            <td>${e.notiz}</td>
            <td>
                <button class="danger"
                onclick="deleteEntry(${i})">
                X
                </button>
            </td>
        </tr>
        `;
    });

    updateStats();
    updateChart();
}

function updateStats(){

    let totalOil = entries.reduce((s,e)=>s+e.oel,0);

    let warnings =
    entries.filter(e=>e.warn).length;

    let km = 0;

    if(entries.length > 1){
        km =
        entries[entries.length-1].km -
        entries[0].km;
    }

    let avg = 0;

    if(km > 0){
        avg = (totalOil/km*100).toFixed(1);
    }

    document.getElementById("gesamtOel").innerText =
    totalOil+" ml";

    document.getElementById("gesamtKm").innerText =
    km+" km";

    document.getElementById("verbrauch").innerText =
    avg;

    document.getElementById("warnungen").innerText =
    warnings;

}

let chart;

function updateChart(){

    const labels =
    entries.map(e=>e.km+" km");

    const values =
    entries.map(e=>e.oel);

    if(chart){
        chart.destroy();
    }

    chart = new Chart(
        document.getElementById("chart"),
        {
            type:"line",
            data:{
                labels:labels,
                datasets:[{
                    label:"Nachgefülltes Öl (ml)",
                    data:values,
                    tension:0.3
                }]
            },
            options:{
                responsive:true
            }
        }
    );
}

function exportData(){

    const blob = new Blob(
        [JSON.stringify(entries,null,2)],
        {type:"application/json"}
    );

    const a = document.createElement("a");

    a.href = URL.createObjectURL(blob);

    a.download = "roller-oel-tracker.json";

    a.click();
}

function importData(){

    const file =
    document.getElementById("importFile").files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(event){

        entries =
        JSON.parse(event.target.result);

        saveData();
        render();
    }

    reader.readAsText(file);
}

render();

</script>

</body>
</html>
