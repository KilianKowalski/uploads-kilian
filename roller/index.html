<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Roller Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans pb-10">
    <header class="bg-indigo-700 text-white p-4 shadow-md text-center sticky top-0 z-50">
        <h1 class="text-xl font-bold">🛵 Roller-Tracker</h1>
        <p class="text-xs text-indigo-200">Getrenntschmierung & Ölleck-Analyse</p>
    </header>
    <main class="max-w-md mx-auto px-4 mt-6 space-y-6">
        <section class="bg-gray-800 p-5 rounded-2xl shadow-xl border border-gray-700">
            <h2 class="text-lg font-semibold mb-4 text-indigo-400">📝 Tanken / Öl voll</h2>
            <form id="tForm" class="space-y-4">
                <div><label class="block text-xs text-gray-400 mb-1">Datum</label><input type="date" id="date" required class="w-full bg-gray-700 rounded-xl px-3 py-2 text-white"></div>
                <div><label class="block text-xs text-gray-400 mb-1">Kilometerstand (Gesamt)</label><input type="number" id="odo" placeholder="z.B. 205" required class="w-full bg-gray-700 rounded-xl px-3 py-2 text-white"></div>
                <div><label class="block text-xs text-gray-400 mb-1">Benzin (Liter)</label><input type="number" step="0.01" id="fuel" placeholder="z.B. 5.2" required class="w-full bg-gray-700 rounded-xl px-3 py-2 text-white"></div>
                <div class="bg-gray-700/40 p-3 rounded-xl border border-gray-700">
                    <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="oF" class="w-4 h-4"><span class="text-xs text-gray-300">Habe heute ÖL randvoll gefüllt</span></label>
                    <div id="oBox" class="hidden mt-2"><label class="block text-xs text-gray-400 mb-1">Ölmenge (ml)</label><input type="number" id="oil" placeholder="z.B. 800" class="w-full bg-gray-700 rounded-xl px-3 py-2 text-white"></div>
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white font-medium py-3 rounded-xl shadow-lg">Speichern</button>
            </form>
        </section>
        <section class="bg-gray-800 p-5 rounded-2xl shadow-xl border border-gray-700 space-y-4">
            <h2 class="text-lg font-semibold text-indigo-400">📊 Analyse</h2>
            <div id="oWarn" class="hidden bg-red-900/40 border border-red-500/50 p-3 rounded-xl text-xs text-red-300">⚠️ <strong>Ölleck-Verdacht!</strong> Dein Ölverbrauch ist kritisch hoch!</div>
            <div class="relative h-64 w-full"><canvas id="aChart"></canvas></div>
        </section>
        <div class="flex gap-3">
            <button onclick="expCSV()" class="flex-1 bg-emerald-600 text-white text-sm font-medium py-3 rounded-xl shadow-lg">🍏 Numbers Export</button>
            <button onclick="cls()" class="bg-gray-700 text-gray-400 text-xs py-3 px-4 rounded-xl">Leeren</button>
        </div>
        <section class="bg-gray-800 p-4 rounded-2xl shadow-xl border border-gray-700 overflow-hidden">
            <h2 class="text-md font-semibold mb-3 text-indigo-400">Historie</h2>
            <div class="overflow-x-auto"><table class="w-full text-left text-xs">
                <thead><tr class="border-b border-gray-700 text-gray-400"><th class="py-2">Datum</th><th class="py-2">Gefahren</th><th class="py-2">Benzin/100km</th><th class="py-2">Öl/100km</th></tr></thead>
                <tbody id="tBody" class="divide-y divide-gray-700/50"></tbody>
            </table></div>
        </section>
    </main>
    <script>
        let db = JSON.parse(localStorage.getItem('sc_logs')) || []; let chart = null;
        document.getElementById('date').value = new Date().toISOString().split('T')[0];
        document.getElementById('oF').addEventListener('change', e => {
            document.getElementById('oBox').style.display = e.target.checked ? 'block' : 'none';
            document.getElementById('oil').required = e.target.checked;
        });
        document.getElementById('tForm').addEventListener('submit', e => {
            e.preventDefault(); const isO = document.getElementById('oF').checked;
            const item = { date: document.getElementById('date').value, odo: parseInt(document.getElementById('odo').value), fuel: parseFloat(document.getElementById('fuel').value), oil: isO ? parseInt(document.getElementById('oil').value) : 0, isO: isO };
            if(db.length > 0 && item.odo <= db[db.length - 1].odo) { alert("Kilometerstand muss höher sein!"); return; }
            db.push(item); ui(); document.getElementById('fuel').value = ''; document.getElementById('oil').value = ''; document.getElementById('oF').checked = false; document.getElementById('oBox').style.display = 'none';
        });
        function calc() {
            let res = [], leak = false;
            for (let i = 0; i < db.length; i++) {
                let cur = db[i], pre = i > 0 ? db[i-1] : null;
                let km = pre ? (cur.odo - pre.odo) : 0;
                let f100 = (pre && km > 0) ? ((cur.fuel / km) * 100).toFixed(2) : "-";
                let o100 = "-";
                if (cur.isO && i > 0) {
                    let lIdx = -1; for (let j = i - 1; j >= 0; j--) { if (db[j].isO || j === 0) { lIdx = j; break; } }
                    if (lIdx !== -1) { let oKm = cur.odo - db[lIdx].odo; if (oKm > 0) o100 = (((cur.oil / 1000) / oKm) * 100).toFixed(2); }
                }
                if(o100 !== "-" && parseFloat(o100) > 0.20) leak = true;
                res.push({ date: new Date(cur.date).toLocaleDateString('de-DE', {day:'2-digit', month:'short'}), km: km, f100: f100, o100: o100 });
            }
            document.getElementById('oWarn').style.display = leak ? 'block' : 'none'; return res;
        }
        function ui() {
            db.sort((a, b) => new Date(a.date) - new Date(b.date)); localStorage.setItem('sc_logs', JSON.stringify(db)); const data = calc();
            const tb = document.getElementById('tBody'); tb.innerHTML = '';
            [...data].reverse().forEach((r, idx) => {
                let oL = db[data.length - 1 - idx];
                tb.innerHTML += `<tr class="hover:bg-gray-700/30 ${oL.isO ? 'bg-indigo-950/20' : ''}"><td class="py-3 font-medium">${r.date} ${oL.isO ? '🛢️' : ''}</td><td class="py-3 text-gray-300">${r.km ? r.km + ' km' : 'Start'}</td><td class="py-3 text-amber-400 font-semibold">${r.f100} ${r.f100 !== '-' ? 'L' : ''}</td><td class="py-3 text-red-400 font-semibold">${r.o100 !== '-' ? r.o100 + ' L' : '-'}</td></tr>`;
            });
            if (chart) chart.destroy();
            chart = new Chart(document.getElementById('aChart').getContext('2d'), {
                type: 'line', data: { labels: data.map(d => d.date), datasets: [
                    { label: 'Benzin (L)', data: data.map(d => d.f100 === "-" ? null : parseFloat(d.f100)), borderColor: '#f59e0b', backgroundColor: 'rgba(245,158,11,0.1)', tension: 0.2, yAxisID: 'y', spanGaps: true },
                    { label: 'Öl (L)', data: data.map(d => d.o100 === "-" ? null : parseFloat(d.o100)), borderColor: '#f43f5e', backgroundColor: 'rgba(244,63,94,0.1)', tension: 0.2, yAxisID: 'y1', spanGaps: true }
                ]},
                options: { responsive: true, maintainAspectRatio: false, scales: { x: { grid: { color: '#374151' } }, y: { type: 'linear', position: 'left' }, y1: { type: 'linear', position: 'right', grid: { drawOnChartArea: false } } } }
            });
        }
        function expCSV() {
            if(db.length === 0) return; const data = calc(); let csv = "data:text/csv;charset=utf-8,Datum;Kilometerstand;Gefahrene Kilometer;Benzin (Lit);Benzin pro 100 km;Oel vollgefuellt (ml);Oel pro 100 km\r\n";
            db.forEach((l, i) => { csv += [l.date, l.odo, data[i].km, l.fuel.toString().replace('.', ','), data[i].f100.toString().replace('.', ','), l.isO ? l.oil : 0, data[i].o100.toString().replace('.', ',')].join(";") + "\r\n"; });
            const link = document.createElement("a"); link.href = encodeURI(csv); link.download = `Roller_Daten.csv`; document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }
        function cls() { if(confirm("Alle Daten löschen?")) { db = []; ui(); } }
        ui();
    </script>
</body>
</html>
