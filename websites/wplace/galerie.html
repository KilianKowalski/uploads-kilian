<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Wplace Projekte – Galerie</title>

  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>

<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">⬛</span>
        <span class="brand-text">Wplace Projekte</span>
      </a>

      <nav class="nav">
        <a class="nav-link" href="index.html">Start</a>
        <a class="nav-link active" href="galerie.html">Galerie</a>
        <a class="nav-link" href="at-work.html">At-Work</a>
      </nav>

      <button class="btn btn-ghost" id="themeToggle" type="button" aria-label="Theme umschalten">
        🌙/☀️
      </button>
    </div>
  </header>

  <main class="container section">
    <div class="section-head">
      <h1>Galerie</h1>
      <p class="muted">
        Vorschauen der Projekte + Button zu den Koordinaten.
        Du kannst jederzeit neue Projekte in <code>assets/data.js</code> hinzufügen.
      </p>
    </div>

    <div class="toolbar">
      <div class="chips" id="tagChips"></div>

      <div class="search">
        <input id="searchInput" type="search" placeholder="Suchen (Titel, Tags, Notiz) …" />
      </div>

      <select id="statusFilter" class="select">
        <option value="all">Alle</option>
        <option value="done">Nur fertig</option>
        <option value="wip">Nur in Arbeit</option>
      </select>
    </div>

    <div class="grid" id="galleryGrid">
      <!-- JS füllt das -->
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-left">
        <b>Wplace Projekte</b>
        <div class="muted small">Galerie – fertig & in Arbeit.</div>
      </div>
      <div class="footer-right small muted">
        <span id="year"></span>
      </div>
    </div>
  </footer>

  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
