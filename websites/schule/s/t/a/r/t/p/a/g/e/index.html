<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Startseite Schüler</title>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="pics/LEGO.png" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1f2c3a, #3a3f4f);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* HEADER */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            z-index: 1000;
        }

        header img {
            height: 45px;
            cursor: pointer;
        }

        header h1 {
            color: #f0f0f0;
            font-size: 22px;
            text-align: center;
            flex: 1;
        }

        /* ICON GRID */
        .icon-grid {
            display: grid;
            grid-template-columns: repeat(6, 200px);
            gap: 35px;
            padding: 120px 40px 60px;
            justify-content: center;
        }

        .icon-card {
            width: 200px;
            height: 200px;
            background: rgba(255,255,255,0.06);
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(18px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
            transition: 0.3s ease;
        }

        .icon-card:hover {
            transform: translateY(-10px) scale(1.05);
            background: rgba(255,255,255,0.12);
        }

        .icon-card img {
            width: 70px;
            height: 70px;
            margin-bottom: 15px;
        }

        .icon-card span {
            color: #f0f0f0;
            font-weight: 700;
            font-size: 16px;
        }

        /* CONTENT SECTIONS */
        .section {
            max-width: 1000px;
            margin: 60px auto;
            padding: 25px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            backdrop-filter: blur(25px);
            opacity: 0;
            transform: translateY(60px);
            transition: 0.7s ease;
            box-shadow: 0 10px 35px rgba(0,0,0,0.35);
        }

        .section.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .section h2 {
            color: #f0f0f0;
            margin-bottom: 20px;
        }

        .section iframe {
            width: 100%;
            height: 560px;
            border-radius: 15px;
            border: none;
        }

        /* MOBILE */
        @media (max-width: 1200px) {
            .icon-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 600px) {
            .icon-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .icon-card {
                width: 150px;
                height: 150px;
            }

            .icon-card img {
                width: 55px;
                height: 55px;
            }
        }
    </style>
</head>

<body>

<header>
    <img src="pics/LEGO.png" onclick="window.open('https://example.com','_blank')" />
    <h1>Willkommen an der Schule Baurach!</h1>
    <div style="width:45px;"></div>
</header>

<main class="icon-grid">
    <div class="icon-card" onclick="window.open('https://classroom.google.com','_blank')">
        <img src="pics/classroom.png">
        <span>Google Classroom</span>
    </div>

    <div class="icon-card" onclick="window.open('https://portal.bycs.de','_blank')">
        <img src="pics/bycs_logo.png">
        <span>ByCS</span>
    </div>

    <div class="icon-card" onclick="window.open('https://eduplaces.de','_blank')">
        <img src="pics/eduplaces_logo.png">
        <span>Eduplaces</span>
    </div>

    <div class="icon-card" onclick="window.open('https://drive.google.com','_blank')">
        <img src="pics/google_drive_logo.png">
        <span>Google Drive</span>
    </div>

    <div class="icon-card" onclick="window.open('https://canva.com','_blank')">
        <img src="pics/canva_logo.png">
        <span>Canva</span>
    </div>

    <div class="icon-card" onclick="window.open('https://quizlet.com','_blank')">
        <img src="pics/quizlet_logo.png">
        <span>Quizlet</span>
    </div>
</main>

<div class="section">
    <h2>Informationen</h2>
    <iframe src="https://docs.google.com/presentation/d/e/2PACX-1vQcpDk0dYmzJ9ek6DpKa-0Fw9Sq5gSYYoITdk6g9hBIFHWNt8xBDiaGJd3fiik_9OIq7vykGClSMn-9/pubembed"></iframe>
</div>

<div class="section">
    <h2>Speiseplan</h2>
    <iframe src="https://docs.google.com/presentation/d/e/2PACX-1vRCTIxBVVX9S4EJ6TITeVC8rqWMQEImULg9MpTN3IoJyvlrLCKgdwlQSocvcjQxAe4tqPkw1wrkaXeM/embed"></iframe>
</div>

<script>
    const sections = document.querySelectorAll('.section');
    const reveal = () => {
        const h = window.innerHeight;
        sections.forEach(sec => {
            if (sec.getBoundingClientRect().top < h - 100) {
                sec.classList.add('visible');
            }
        });
    };
    window.addEventListener('scroll', reveal);
    window.addEventListener('load', reveal);
</script>

</body>
</html>
