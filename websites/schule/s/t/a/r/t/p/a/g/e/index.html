<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Startseite Schüler</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="pics/LEGO.png" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1f2c3a, #3a3f4f);
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        #santa {
            transform: rotate(45deg);
            position: fixed;
            left: -50px;
            bottom: 0;
            width: 150px;
            z-index: 500;
            pointer-events: none;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            z-index: 1000;
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

        header img {
            height: 45px;
            cursor: pointer;
        }

        header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #f0f0f0;
            text-align: center;
            flex: 1;
        }

        .icon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 35px;
            padding: 110px 50px 50px;
            justify-items: center;
        }

        .icon-card {
            background: rgba(255, 255, 255, 0.05);
            width: 200px;
            height: 200px;
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s, box-shadow 0.3s, background 0.3s;
            cursor: pointer;
            backdrop-filter: blur(18px);
        }

        .icon-card:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4);
            background: rgba(255, 255, 255, 0.1);
        }

        .icon-card img {
            width: 70px;
            height: 70px;
            margin-bottom: 15px;
        }

        .icon-card span {
            font-weight: 700;
            font-size: 16px;
            color: #f0f0f0;
        }

        .section {
            max-width: 1000px;
            margin: 60px auto;
            padding: 25px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            backdrop-filter: blur(25px);
            opacity: 0;
            transform: translateY(60px);
            transition: all 0.7s ease;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.35);
            border-left: 5px solid rgba(255,255,255,0.2);
        }

        .section.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .section h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 18px;
            color: #f0f0f0;
            text-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }

        .section iframe {
            width: 100%;
            height: 569px;
            border: none;
            border-radius: 15px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(12px);
        }

        .snowflake {
            position: fixed;
            top: -10px;
            color: #fff;
            font-size: 1rem;
            user-select: none;
            pointer-events: none;
            z-index: 2000;
            opacity: 0.3;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10px) translateX(0); }
            100% { transform: translateY(110vh) translateX(20px); }
        }


        @media (max-width: 600px) {
            .icon-grid {
                padding: 110px 20px 40px;
            }
            .icon-card {
                width: 150px;
                height: 150px;
            }
            .icon-card img {
                width: 55px;
                height: 55px;
            }
            #santa {
                width: 100px;
            }
        }
    </style>
</head>
<body>

<img src="pics/santa.png" id="santa" alt="Weihnachtsmann" />

<script>
    const sections = document.querySelectorAll('.section');
    const revealOnScroll = () => {
        const windowHeight = window.innerHeight;
        sections.forEach(section => {
            const top = section.getBoundingClientRect().top;
            if(top < windowHeight - 100) {
                section.classList.add('visible');
            }
        });
    };
    window.addEventListener('scroll', revealOnScroll);
    window.addEventListener('load', revealOnScroll);

    const snowflakeCount = 50;
    for(let i=0; i<snowflakeCount; i++) {
        setTimeout(() => {
            const snowflake = document.createElement('div');
            snowflake.classList.add('snowflake');
            snowflake.style.left = Math.random() * 100 + 'vw';
            snowflake.style.fontSize = (Math.random() * 10 + 10) + 'px';
            snowflake.style.opacity = (Math.random() * 0.5 + 0.1);
            snowflake.style.animationDuration = (Math.random() * 40 + 30) + 's';
            snowflake.innerText = '❄';
            document.body.appendChild(snowflake);
        }, i * 500 + Math.random() * 1000);
    }
</script>
