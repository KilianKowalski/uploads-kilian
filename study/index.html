<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kilian LernApp</title>
<link rel="manifest" href="manifest.json">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #0f0f0f;
  color: white;
}

header {
  padding: 20px;
  font-size: 22px;
  font-weight: bold;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill,minmax(140px,1fr));
  gap: 15px;
  padding: 20px;
}

.subject-card {
  padding: 30px 10px;
  border-radius: 20px;
  text-align: center;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

.subject-card:hover {
  transform: scale(1.05);
}

.topic-list {
  padding: 20px;
}

.topic {
  padding: 15px;
  background: #1c1c1c;
  margin-bottom: 10px;
  border-radius: 15px;
  cursor: pointer;
}

.card-view {
  padding: 20px;
}

button {
  padding: 10px 15px;
  border-radius: 12px;
  border: none;
  background: #333;
  color: white;
  margin: 5px;
}

img {
  max-width: 100%;
  border-radius: 15px;
}
</style>
</head>

<body>

<header id="header">📚 Meine Fächer</header>

<div id="content"></div>

<script>
let data;
let currentCards = [];
let currentIndex = 0;

fetch("data/data.json")
.then(res => res.json())
.then(json => {
  data = json;
  showSubjects();
});

function showSubjects() {
  header.innerText = "📚 Meine Fächer";
  let html = '<div class="grid">';
  data.subjects.forEach((s,i)=>{
    html += `
      <div class="subject-card" 
           style="background:${s.color}" 
           onclick="showTopics(${i})">
        ${s.name}
      </div>`;
  });
  html += "</div>";
  content.innerHTML = html;
}

function showTopics(index){
  header.innerText = data.subjects[index].name;
  let html = '<div class="topic-list">';
  data.subjects[index].topics.forEach((t,i)=>{
    html += `
      <div class="topic" onclick="showCards(${index},${i})">
        ${t.name}
      </div>`;
  });
  html += `<button onclick="showSubjects()">⬅ Zurück</button>`;
  html += "</div>";
  content.innerHTML = html;
}

function showCards(subjectIndex, topicIndex){
  currentCards = data.subjects[subjectIndex].topics[topicIndex].cards;
  currentIndex = 0;
  renderCard(subjectIndex, topicIndex);
}

function renderCard(subjectIndex, topicIndex){
  let card = currentCards[currentIndex];
  header.innerText = card.title;

  content.innerHTML = `
    <div class="card-view">
      <p>${card.text}</p>
      <img src="assets/images/${card.image}" onclick="this.requestFullscreen()">
      <br><br>
      <audio src="assets/audio/${card.audio}" controls loop></audio>
      <br>
      <button onclick="prevCard(${subjectIndex},${topicIndex})">⬅</button>
      <button onclick="nextCard(${subjectIndex},${topicIndex})">➡</button>
      <button onclick="showTopics(${subjectIndex})">Zurück</button>
    </div>
  `;
}

function nextCard(s,t){
  if(currentIndex < currentCards.length-1){
    currentIndex++;
    renderCard(s,t);
  }
}

function prevCard(s,t){
  if(currentIndex > 0){
    currentIndex--;
    renderCard(s,t);
  }
}
</script>

</body>
</html>
