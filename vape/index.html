<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Opfer Tracker</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0b0f14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Counter">
  <!-- <link rel="apple-touch-icon" href="icon-192.png"> -->

  <style>
    :root {
      --bg: #0b0f14;
      --card: #121824;
      --muted: #7f8aa3;
      --text: #e7ecf7;
      --accent: #7c5cff;
      --danger: #ff4d6d;
      --ok: #2dd4bf;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, Segoe UI, Roboto, Arial;
      background: linear-gradient(180deg, #070a10, var(--bg));
      color: var(--text);
    }

    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 18px;
    }

    h1 {
      font-size: 20px;
      margin: 0 0 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    @media (min-width: 900px) {
      .grid {
        grid-template-columns: 1.2fr 0.8fr;
      }
    }

    .card {
      background: rgba(18, 24, 36, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .big {
      font-size: 52px;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
    }

    button,
    input {
      font: inherit;
    }

    .btn {
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.15s transform, 0.15s background;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn.primary {
      background: rgba(124, 92, 255, 0.22);
      border-color: rgba(124, 92, 255, 0.55);
    }

    .btn.danger {
      background: rgba(255, 77, 109, 0.16);
      border-color: rgba(255, 77, 109, 0.5);
    }

    .btn.ok {
      background: rgba(45, 212, 191, 0.16);
      border-color: rgba(45, 212, 191, 0.5);
    }

    .pill {
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.03);
      font-size: 12px;
      color: var(--muted);
    }

    input[type="number"] {
      width: 140px;
      max-width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text);
      outline: none;
    }

    canvas {
      width: 100%;
      height: 160px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 8px 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      text-align: left;
      font-size: 13px;
    }

    th {
      color: var(--muted);
      font-weight: 600;
    }

    .right {
      text-align: right;
    }

    .footer {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
    }

    .tiny {
      font-size: 12px;
      color: var(--muted);
    }

    .notice {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.35;
    }

    .kpi {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .kpi .item {
      padding: 10px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.03);
    }

    .kpi .label {
      font-size: 12px;
      color: var(--muted);
    }

    .kpi .val {
      font-size: 18px;
      font-weight: 700;
      margin-top: 4px;
    }
  </style>
</head>

</html>
