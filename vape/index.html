<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Opfer Tracker</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0b0f14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Counter">

  <style>
    :root { --bg:#0b0f14; --card:#121824; --muted:#7f8aa3; --text:#e7ecf7; --accent:#7c5cff; --danger:#ff4d6d; --ok:#2dd4bf; }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,Segoe UI,Roboto,Arial;background:linear-gradient(180deg,#070a10,var(--bg));color:var(--text)}
    .wrap{max-width:980px;margin:0 auto;padding:18px}
    h1{font-size:20px;margin:0 0 10px}
    .grid{display:grid;grid-template-columns:1fr;gap:12px}
    @media (min-width:900px){ .grid{grid-template-columns:1.2fr .8fr} }
    .card{background:rgba(18,24,36,.9);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .big{font-size:52px;font-weight:800;letter-spacing:-1px;line-height:1}
    .muted{color:var(--muted);font-size:13px}
    button,input{font:inherit}
    .btn{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:var(--text);padding:10px 12px;border-radius:12px;cursor:pointer}
    .btn.primary{background:rgba(124,92,255,.22);border-color:rgba(124,92,255,.55)}
    .btn.danger{background:rgba(255,77,109,.16);border-color:rgba(255,77,109,.5)}
    .btn.ok{background:rgba(45,212,191,.16);border-color:rgba(45,212,191,.5)}
    .pill{padding:6px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);font-size:12px;color:var(--muted)}
    input[type="number"]{width:140px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.12);color:var(--text)}
    canvas{width:100%;height:160px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08)}
    table{width:100%;border-collapse:collapse}
    th,td{padding:8px 6px;border-bottom:1px solid rgba(255,255,255,.08);font-size:13px}
    th{color:var(--muted)}
    .right{text-align:right}
    .kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .kpi .item{padding:10px;border-radius:12px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03)}
    .kpi .label{font-size:12px;color:var(--muted)}
    .kpi .val{font-size:18px;font-weight:700}
  </style>
</head>

<body>
<div class="wrap">
  <h1>Vape Tracker</h1>

  <div class="grid">
    <div class="card">
      <div class="muted">Heute</div>
      <div class="big" id="todayCount">0</div>
      <span class="pill" id="todayDatePill"></span>
    </div>

    <div class="card">
      <div class="muted">Statistiken</div>

      <div class="kpi">
        <div class="item"><div class="label">Gestern</div><div class="val" id="yesterday">0</div></div>
        <div class="item"><div class="label">Letzte 7 Tage (Summe)</div><div class="val" id="sum7">0</div></div>
        <div class="item"><div class="label">Ø pro Tag (letzte 7)</div><div class="val" id="avg7">0</div></div>
        <div class="item"><div class="label">Ø pro Tag (letzte 30)</div><div class="val" id="avg30">0</div></div>
        <div class="item"><div class="label">Max/Tag (letzte 30)</div><div class="val" id="max30">0</div></div>
        <div class="item"><div class="label">Gesamt</div><div class="val" id="totalAll">0</div></div>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const STORAGE_KEY = "local_counter_tracker_v1";

  const els = {
    todayCount: document.getElementById("todayCount"),
    todayDatePill: document.getElementById("todayDatePill"),
    yesterday: document.getElementById("yesterday"),
    sum7: document.getElementById("sum7"),
    avg7: document.getElementById("avg7"),
    avg30: document.getElementById("avg30"),
    max30: document.getElementById("max30"),
    totalAll: document.getElementById("totalAll"),
  };

  const pad = n => String(n).padStart(2,"0");
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const addDays = (d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};

  function load(){
    try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {history:{}} }
    catch{ return {history:{}} }
  }

  function get(d,k){ return Number(d.history[k]||0) }

  function stats(d){
    let sum7=0,sum30=0,max30=0,total=0;
    for(let i=0;i<30;i++){
      const c=get(d,iso(addDays(new Date(),-i)));
      total+=c;
      sum30+=c;
      max30=Math.max(max30,c);
      if(i<7) sum7+=c;
    }
    return {
      yesterday:get(d,iso(addDays(new Date(),-1))),
      sum7,
      avg7:sum7/7,
      avg30:sum30/30,
      max30,
      total
    };
  }

  function render(){
    const d=load();
    const today=iso(new Date());
    d.history[today]??=0;
    localStorage.setItem(STORAGE_KEY,JSON.stringify(d));

    els.todayCount.textContent=d.history[today];
    els.todayDatePill.textContent=new Date().toLocaleDateString("de-DE");

    const s=stats(d);
    els.yesterday.textContent=s.yesterday;
    els.sum7.textContent=s.sum7;
    els.avg7.textContent=s.avg7.toFixed(1);
    els.avg30.textContent=s.avg30.toFixed(1);
    els.max30.textContent=s.max30;
    els.totalAll.textContent=s.total;
  }

  render();
})();
</script>
</body>
</html>
