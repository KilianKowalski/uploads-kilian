<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Countdown</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: "Courier New", monospace;
    color: #d0d0d0;
  }

  /* Kreis Container */
  .circle-container {
    position: relative;
    width: min(60vh, 60vw);
    height: min(60vh, 60vw);
    margin-bottom: 5vh;
  }

  svg {
    width: 100%;
    height: 100%;
  }

  /* Countdown */
  .countdown {
    display: flex;
    gap: 3vw;
  }

  .unit {
    text-align: center;
  }

  .value {
    background: #111;
    padding: 3vh 3vw;
    border-radius: 1vw;
    font-size: 8vw;
    box-shadow: 0 1vw 2vw rgba(0,0,0,0.7);
    min-width: 15vw;
  }

  .label {
    margin-top: 1vh;
    color: #aaa;
    font-size: 2vw;
    letter-spacing: 0.2em;
  }

  @media (max-width: 768px) {
    .value {
      font-size: 14vw;
      min-width: 30vw;
      border-radius: 3vw;
    }
    .label {
      font-size: 5vw;
    }
  }
</style>
</head>
<body>

<!-- Kreis mit Tagesstrichen -->
<div class="circle-container">
  <svg id="yearCircle"></svg>
</div>

<!-- Countdown -->
<div class="countdown">
  <div class="unit">
    <div class="value" id="days">00</div>
    <div class="label">Tage</div>
  </div>
  <div class="unit">
    <div class="value" id="hours">00</div>
    <div class="label">Stunden</div>
  </div>
  <div class="unit">
    <div class="value" id="minutes">00</div>
    <div class="label">Minuten</div>
  </div>
  <div class="unit">
    <div class="value" id="seconds">00</div>
    <div class="label">Sekunden</div>
  </div>
</div>

<script>
function nextTarget() {
  const now = new Date();
  const year = now.getFullYear();
  const target = new Date(year, 7, 9, 0, 0, 0);
  return now <= target ? target : new Date(year + 1, 7, 9, 0, 0, 0);
}

const target = nextTarget();
const start = new Date(target.getFullYear() - 1, 7, 9, 0, 0, 0);

const svg = document.getElementById("yearCircle");
const totalDays = 365;

/* Kreis-Striche erzeugen */
function createDayMarks() {
  const size = svg.clientWidth;
  const center = size / 2;
  const radius = size * 0.42;

  svg.innerHTML = "";

  for (let i = 0; i < totalDays; i++) {
    const angle = (i / totalDays) * 2 * Math.PI;

    const x1 = center + Math.cos(angle) * radius;
    const y1 = center + Math.sin(angle) * radius;

    const x2 = center + Math.cos(angle) * (radius - size * 0.03);
    const y2 = center + Math.sin(angle) * (radius - size * 0.03);

    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", x1);
    line.setAttribute("y1", y1);
    line.setAttribute("x2", x2);
    line.setAttribute("y2", y2);
    line.setAttribute("stroke-width", size * 0.005);
    line.setAttribute("stroke", "#333");
    line.setAttribute("id", "day-" + i);

    svg.appendChild(line);
  }
}

createDayMarks();

/* Fortschritt aktualisieren */
function updateProgress() {
  const now = new Date();
  const passedDays = Math.floor((now - start) / (1000 * 60 * 60 * 24));

  for (let i = 0; i < totalDays; i++) {
    const line = document.getElementById("day-" + i);
    if (i <= passedDays) {
      line.setAttribute("stroke", "#00eaff");
    } else {
      line.setAttribute("stroke", "#333");
    }
  }
}

/* Countdown aktualisieren */
function tick() {
  const now = new Date();
  const diff = target - now;

  const total = Math.floor(diff / 1000);
  const d = String(Math.floor(total / 86400)).padStart(2, "0");
  const h = String(Math.floor((total % 86400) / 3600)).padStart(2, "0");
  const m = String(Math.floor((total % 3600) / 60)).padStart(2, "0");
  const s = String(total % 60).padStart(2, "0");

  document.getElementById("days").textContent = d;
  document.getElementById("hours").textContent = h;
  document.getElementById("minutes").textContent = m;
  document.getElementById("seconds").textContent = s;

  updateProgress();
}

tick();
setInterval(tick, 1000);

/* Neu zeichnen bei Größenänderung */
window.addEventListener("resize", () => {
  createDayMarks();
  updateProgress();
});
</script>

</body>
</html>
