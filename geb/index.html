<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>geb geb geb</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: "Courier New", monospace;
    color: #d0d0d0;
  }

  .countdown {
    display: flex;
    gap: 3vw;
    margin-bottom: 5vh;
  }

  .unit {
    text-align: center;
  }

  .value {
    background: #111;
    padding: 3vh 3vw;
    border-radius: 1vw;
    font-size: 10vw;
    box-shadow: 0 1vw 2vw rgba(0,0,0,0.7);
    min-width: 18vw;
  }

  .label {
    margin-top: 1vh;
    color: #aaa;
    font-size: 2vw;
    letter-spacing: 0.2em;
  }

  /* Fortschrittsbalken */
  .progress-container {
    width: 80vw;
    height: 3vh;
    background: #222;
    border-radius: 2vh;
    overflow: hidden;
    box-shadow: 0 0.5vw 1vw rgba(0,0,0,0.6);
  }

  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #00aaff, #00ffd5);
    transition: width 0.5s ease;
  }

  @media (max-width: 768px) {
    .value {
      font-size: 18vw;
      min-width: 35vw;
      border-radius: 3vw;
    }
    .label {
      font-size: 5vw;
    }
    .progress-container {
      width: 90vw;
      height: 4vh;
    }
  }
</style>
</head>
<body>

<div class="countdown">
  <div class="unit">
    <div class="value" id="days">00</div>
    <div class="label">Tage</div>
  </div>
  <div class="unit">
    <div class="value" id="hours">00</div>
    <div class="label">Stunden</div>
  </div>
  <div class="unit">
    <div class="value" id="minutes">00</div>
    <div class="label">Minuten</div>
  </div>
  <div class="unit">
    <div class="value" id="seconds">00</div>
    <div class="label">Sekunden</div>
  </div>
</div>

<div class="progress-container">
  <div class="progress-bar" id="progress"></div>
</div>

<script>
function nextTarget() {
  const now = new Date();
  const year = now.getFullYear();
  const target = new Date(year, 7, 9, 0, 0, 0);
  return now <= target ? target : new Date(year + 1, 7, 9, 0, 0, 0);
}

const target = nextTarget();
const start = new Date(target.getFullYear() - 1, 7, 9, 0, 0, 0); // 9.8. letztes Jahr

function tick() {
  const now = new Date();
  const diff = target - now;

  const total = Math.floor(diff / 1000);
  const d = String(Math.floor(total / 86400)).padStart(2, "0");
  const h = String(Math.floor((total % 86400) / 3600)).padStart(2, "0");
  const m = String(Math.floor((total % 3600) / 60)).padStart(2, "0");
  const s = String(total % 60).padStart(2, "0");

  document.getElementById("days").textContent = d;
  document.getElementById("hours").textContent = h;
  document.getElementById("minutes").textContent = m;
  document.getElementById("seconds").textContent = s;

  // Fortschrittsbalken berechnen
  const fullYearSeconds = (target - start) / 1000;
  const passedSeconds = (now - start) / 1000;
  const percent = Math.min(100, Math.max(0, (passedSeconds / fullYearSeconds) * 100));

  document.getElementById("progress").style.width = percent + "%";
}

tick();
setInterval(tick, 1000);
</script>

</body>
</html>
