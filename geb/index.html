<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Countdown</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    color: #d0d0d0;
    font-family: "Courier New", monospace;
    overflow-x: hidden;
  }

  /* --- Hauptbereich: Countdown --- */
  .countdown-section {
    height: 100vh;
    padding: 4vh 4vw; /* Abstand zum Rand */
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  .countdown {
    display: flex;
    gap: 3vw;
    width: 100%;
    justify-content: center;
  }

  .unit {
    text-align: center;
    flex: 1;
  }

  .value {
    background: #111;
    padding: 5vh 0;
    border-radius: 3vw;
    font-size: 14vw;
    font-weight: bold;
    box-shadow: 0 1vw 2vw rgba(0,0,0,0.7);
    width: 100%;
  }

  .label {
    margin-top: 1vh;
    color: #aaa;
    font-size: 6vw;
    letter-spacing: 0.2em;
  }

  @media (min-width: 769px) {
    .value {
      font-size: 8vw;
      padding: 4vh 0;
      border-radius: 1vw;
    }
    .label {
      font-size: 2vw;
    }
    .countdown-section {
      padding: 6vh 6vw; /* größerer Rand auf PC */
    }
  }

  /* --- Fortschrittskreis unten --- */
  .circle-section {
    height: 100vh;
    padding: 4vh 4vw; /* Abstand zum Rand */
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  .circle-container {
    position: relative;
    width: min(70vh, 70vw);
    height: min(70vh, 70vw);
  }

  svg {
    width: 100%;
    height: 100%;
  }

  .percent-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: min(10vh, 10vw);
    font-weight: bold;
    color: #00eaff;
  }
</style>
</head>
<body>

<!-- Countdown oben -->
<section class="countdown-section">
  <div class="countdown">
    <div class="unit">
      <div class="value" id="days">00</div>
      <div class="label">Tage</div>
    </div>
    <div class="unit">
      <div class="value" id="hours">00</div>
      <div class="label">Stunden</div>
    </div>
    <div class="unit">
      <div class="value" id="minutes">00</div>
      <div class="label">Minuten</div>
    </div>
    <div class="unit">
      <div class="value" id="seconds">00</div>
      <div class="label">Sekunden</div>
    </div>
  </div>
</section>

<!-- Fortschrittskreis unten -->
<section class="circle-section">
  <div class="circle-container">
    <svg id="yearCircle"></svg>
    <div class="percent-text" id="percent">0.000%</div>
  </div>
</section>

<script>
function nextTarget() {
  const now = new Date();
  const year = now.getFullYear();
  const target = new Date(year, 7, 9, 0, 0, 0);
  return now <= target ? target : new Date(year + 1, 7, 9, 0, 0, 0);
}

const target = nextTarget();
const start = new Date(target.getFullYear() - 1, 7, 9, 0, 0, 0);

const svg = document.getElementById("yearCircle");
const percentText = document.getElementById("percent");
const totalDays = 365;

/* Kreis-Striche erzeugen */
function createDayMarks() {
  const size = svg.clientWidth;
  const center = size / 2;
  const radiusOuter = size * 0.45;
  const radiusInner = size * 0.30;

  svg.innerHTML = "";

  for (let i = 0; i < totalDays; i++) {
    const angle = (i / totalDays) * 2 * Math.PI;

    const x1 = center + Math.cos(angle) * radiusOuter;
    const y1 = center + Math.sin(angle) * radiusOuter;

    const x2 = center + Math.cos(angle) * radiusInner;
    const y2 = center + Math.sin(angle) * radiusInner;

    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", x1);
    line.setAttribute("y1", y1);
    line.setAttribute("x2", x2);
    line.setAttribute("y2", y2);
    line.setAttribute("stroke-width", size * 0.01);
    line.setAttribute("stroke", "#333");
    line.setAttribute("id", "day-" + i);

    svg.appendChild(line);
  }
}

createDayMarks();

/* Fortschritt aktualisieren */
function updateProgress() {
  const now = new Date();
  const passedDays = Math.floor((now - start) / (1000 * 60 * 60 * 24));

  for (let i = 0; i < totalDays; i++) {
    const line = document.getElementById("day-" + i);
    if (i <= passedDays) {
      line.setAttribute("stroke", "#00eaff");
    } else {
      line.setAttribute("stroke", "#333");
    }
  }

  const fullYearSeconds = (target - start) / 1000;
  const passedSeconds = (now - start) / 1000;
  const percent = (passedSeconds / fullYearSeconds) * 100;

  percentText.textContent = percent.toFixed(3) + "%";
}

/* Countdown aktualisieren */
function tick() {
  const now = new Date();
  const diff = target - now;

  const total = Math.floor(diff / 1000);
  const d = String(Math.floor(total / 86400)).padStart(2, "0");
  const h = String(Math.floor((total % 86400) / 3600)).padStart(2, "0");
  const m = String(Math.floor((total % 3600) / 60)).padStart(2, "0");
  const s = String(total % 60).padStart(2, "0");

  document.getElementById("days").textContent = d;
  document.getElementById("hours").textContent = h;
  document.getElementById("minutes").textContent = m;
  document.getElementById("seconds").textContent = s;

  updateProgress();
}

tick();
setInterval(tick, 1000);

/* Neu zeichnen bei Größenänderung */
window.addEventListener("resize", () => {
  createDayMarks();
  updateProgress();
});
</script>

</body>
</html>
