<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>geb geb geb</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: "Courier New", monospace;
    color: #d0d0d0;
  }

  /* Kreis Fortschritt */
  .circle-container {
    position: relative;
    width: 40vh;
    height: 40vh;
    margin-bottom: 5vh;
  }

  .circle-bg {
    stroke: #222;
    stroke-width: 20;
  }

  .circle-progress {
    stroke: #00eaff;
    stroke-width: 20;
    stroke-linecap: round;
    transform: rotate(-90deg);
    transform-origin: center;
    transition: stroke-dashoffset 0.5s ease;
  }

  .circle-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }

  .circle-text .percent {
    font-size: 6vh;
    font-weight: bold;
  }

  .circle-text .remaining {
    font-size: 2.5vh;
    color: #aaa;
  }

  /* Countdown */
  .countdown {
    display: flex;
    gap: 3vw;
  }

  .unit {
    text-align: center;
  }

  .value {
    background: #111;
    padding: 3vh 3vw;
    border-radius: 1vw;
    font-size: 8vw;
    box-shadow: 0 1vw 2vw rgba(0,0,0,0.7);
    min-width: 15vw;
  }

  .label {
    margin-top: 1vh;
    color: #aaa;
    font-size: 2vw;
    letter-spacing: 0.2em;
  }

  @media (max-width: 768px) {
    .value {
      font-size: 14vw;
      min-width: 30vw;
      border-radius: 3vw;
    }
    .label {
      font-size: 5vw;
    }
    .circle-container {
      width: 60vw;
      height: 60vw;
    }
    .circle-text .percent {
      font-size: 12vw;
    }
    .circle-text .remaining {
      font-size: 5vw;
    }
  }
</style>
</head>
<body>

<!-- Kreis Fortschritt -->
<div class="circle-container">
  <svg width="100%" height="100%">
    <circle class="circle-bg" cx="50%" cy="50%" r="40%"></circle>
    <circle class="circle-progress" cx="50%" cy="50%" r="40%" id="circle"></circle>
  </svg>
  <div class="circle-text">
    <div class="percent" id="percent">0%</div>
    <div class="remaining" id="remaining">Lädt…</div>
  </div>
</div>

<!-- Countdown -->
<div class="countdown">
  <div class="unit">
    <div class="value" id="days">00</div>
    <div class="label">Tage</div>
  </div>
  <div class="unit">
    <div class="value" id="hours">00</div>
    <div class="label">Stunden</div>
  </div>
  <div class="unit">
    <div class="value" id="minutes">00</div>
    <div class="label">Minuten</div>
  </div>
  <div class="unit">
    <div class="value" id="seconds">00</div>
    <div class="label">Sekunden</div>
  </div>
</div>

<script>
function nextTarget() {
  const now = new Date();
  const year = now.getFullYear();
  const target = new Date(year, 7, 9, 0, 0, 0);
  return now <= target ? target : new Date(year + 1, 7, 9, 0, 0, 0);
}

const target = nextTarget();
const start = new Date(target.getFullYear() - 1, 7, 9, 0, 0, 0);

const circle = document.getElementById("circle");
const percentText = document.getElementById("percent");
const remainingText = document.getElementById("remaining");

const radius = circle.r.baseVal.value;
const circumference = 2 * Math.PI * radius;

circle.style.strokeDasharray = `${circumference}`;
circle.style.strokeDashoffset = circumference;

function tick() {
  const now = new Date();
  const diff = target - now;

  const total = Math.floor(diff / 1000);
  const d = String(Math.floor(total / 86400)).padStart(2, "0");
  const h = String(Math.floor((total % 86400) / 3600)).padStart(2, "0");
  const m = String(Math.floor((total % 3600) / 60)).padStart(2, "0");
  const s = String(total % 60).padStart(2, "0");

  document.getElementById("days").textContent = d;
  document.getElementById("hours").textContent = h;
  document.getElementById("minutes").textContent = m;
  document.getElementById("seconds").textContent = s;

  // Kreis Fortschritt
  const fullYearSeconds = (target - start) / 1000;
  const passedSeconds = (now - start) / 1000;
  const percent = Math.min(100, Math.max(0, (passedSeconds / fullYearSeconds) * 100));

  percentText.textContent = Math.floor(percent) + "%";
  remainingText.textContent = `${d} Tage übrig`;

  const offset = circumference - (percent / 100) * circumference;
  circle.style.strokeDashoffset = offset;
}

tick();
setInterval(tick, 1000);
</script>

</body>
</html>
