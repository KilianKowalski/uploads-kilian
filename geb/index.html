<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>geb geb geb</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Courier New", monospace;
  }

  .flapboard {
    display: flex;
    gap: 2vw;
  }

  .unit {
    text-align: center;
  }

  .flip {
    position: relative;
    width: 18vw;
    height: 20vh;
    background: #111;
    color: #d0d0d0;
    border-radius: 1vw;
    overflow: hidden;
    box-shadow: 0 1vw 2vw rgba(0,0,0,0.7);
    font-size: 10vw;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .flip .top,
  .flip .bottom,
  .flip .top-flip,
  .flip .bottom-flip {
    position: absolute;
    width: 100%;
    height: 50%;
    left: 0;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .flip .top { top: 0; border-bottom: 1px solid #333; }
  .flip .bottom { bottom: 0; border-top: 1px solid #333; }

  .flip .top-flip {
    top: 0;
    transform-origin: bottom;
    animation: flipTop 0.3s ease-in forwards;
  }

  .flip .bottom-flip {
    bottom: 0;
    transform-origin: top;
    animation: flipBottom 0.3s ease-out forwards;
  }

  @keyframes flipTop {
    0% { transform: rotateX(0deg); }
    100% { transform: rotateX(-90deg); }
  }

  @keyframes flipBottom {
    0% { transform: rotateX(90deg); }
    100% { transform: rotateX(0deg); }
  }

  .label {
    margin-top: 1vh;
    color: #aaa;
    font-size: 2vw;
    letter-spacing: 0.2em;
  }

  @media (max-width: 768px) {
    .flip { width: 35vw; height: 18vh; font-size: 18vw; border-radius: 3vw; }
    .label { font-size: 5vw; }
  }
</style>
</head>
<body>

<div class="flapboard">
  <div class="unit">
    <div class="flip" id="days"></div>
    <div class="label">Tage</div>
  </div>
  <div class="unit">
    <div class="flip" id="hours"></div>
    <div class="label">Stunden</div>
  </div>
  <div class="unit">
    <div class="flip" id="minutes"></div>
    <div class="label">Minuten</div>
  </div>
  <div class="unit">
    <div class="flip" id="seconds"></div>
    <div class="label">Sekunden</div>
  </div>
</div>

<script>
function nextTarget() {
  const now = new Date();
  const year = now.getFullYear();
  const target = new Date(year, 7, 9, 0, 0, 0);
  return now <= target ? target : new Date(year + 1, 7, 9, 0, 0, 0);
}

const target = nextTarget();

function updateFlip(id, value) {
  const flip = document.getElementById(id);
  const current = flip.dataset.value;

  if (current == value) return;
  flip.dataset.value = value;

  flip.innerHTML = `
    <div class="top">${current || value}</div>
    <div class="bottom">${value}</div>
    <div class="top-flip">${current || value}</div>
    <div class="bottom-flip">${value}</div>
  `;
}

function tick() {
  const now = new Date();
  const diff = target - now;

  const total = Math.floor(diff / 1000);
  const d = String(Math.floor(total / 86400)).padStart(2, "0");
  const h = String(Math.floor((total % 86400) / 3600)).padStart(2, "0");
  const m = String(Math.floor((total % 3600) / 60)).padStart(2, "0");
  const s = String(total % 60).padStart(2, "0");

  updateFlip("days", d);
  updateFlip("hours", h);
  updateFlip("minutes", m);
  updateFlip("seconds", s);
}

tick();
setInterval(tick, 1000);
</script>

</body>
</html>
