<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Startseite</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
height:100vh;
overflow:hidden;
background:linear-gradient(-45deg,#0f172a,#111827,#1e293b,#0f172a);
background-size:400% 400%;
animation:bgMove 15s ease infinite;
display:flex;
justify-content:center;
align-items:center;
color:white;
}

@keyframes bgMove{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

.overlay{
position:absolute;
inset:0;
backdrop-filter:blur(100px);
}

.container{
text-align:center;
width:90%;
max-width:1000px;
animation:appear 1.4s ease;
}

@keyframes appear{
from{
opacity:0;
transform:translateY(40px) scale(.95);
}
to{
opacity:1;
transform:translateY(0) scale(1);
}
}

.greeting{
font-size:4rem;
font-weight:700;
margin-bottom:40px;
text-shadow:0 0 30px rgba(255,255,255,.15);
}

.search-box{
position:relative;
width:100%;
max-width:700px;
margin:auto;
}

.search-box input{
width:100%;
padding:22px 70px;
font-size:1.2rem;
border:none;
outline:none;
border-radius:999px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);
color:white;
transition:.3s;
}

.search-box input:focus{
transform:scale(1.02);
background:rgba(255,255,255,.12);
box-shadow:0 0 30px rgba(255,255,255,.1);
}

.google-logo{
position:absolute;
left:25px;
top:50%;
transform:translateY(-50%);
font-size:1.3rem;
}

.top-left{
position:absolute;
top:25px;
left:25px;
text-align:left;
}

.clock{
font-size:2rem;
font-weight:700;
}

.weather{
opacity:.8;
margin-top:5px;
}

.browser{
position:absolute;
top:25px;
right:25px;
padding:12px 20px;
background:rgba(255,255,255,.08);
border-radius:20px;
backdrop-filter:blur(15px);
}

.links{
position:absolute;
bottom:40px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:20px;
flex-wrap:wrap;
justify-content:center;
}

.link{
width:65px;
height:65px;
border-radius:20px;
background:rgba(255,255,255,.08);
display:flex;
align-items:center;
justify-content:center;
font-size:1.8rem;
text-decoration:none;
color:white;
transition:.3s;
backdrop-filter:blur(20px);
}

.link:hover{
transform:translateY(-8px) scale(1.08);
background:rgba(255,255,255,.15);
}

.start-animation{
position:fixed;
inset:0;
background:#000;
display:flex;
justify-content:center;
align-items:center;
font-size:3rem;
font-weight:700;
z-index:9999;
animation:intro 2s forwards;
}

@keyframes intro{
0%{
opacity:1;
}
70%{
opacity:1;
}
100%{
opacity:0;
visibility:hidden;
}
}

@media(max-width:768px){
.greeting{
font-size:2.5rem;
}
}
</style>
</head>
<body>

<div class="start-animation">
✨ Willkommen Kilian
</div>

<div class="overlay"></div>

<div class="top-left">
<div class="clock" id="clock"></div>
<div class="weather" id="weather">Wetter wird geladen...</div>
</div>

<div class="browser" id="browser"></div>

<div class="container">

<h1 class="greeting" id="greeting">
Hallo Kilian
</h1>

<div class="search-box">
<div class="google-logo">🔍</div>

<input
id="searchInput"
placeholder="Mit Google suchen..."
autocomplete="off">
</div>

</div>

<div class="links">

<a class="link" href="https://youtube.com">▶️</a>

<a class="link" href="https://chatgpt.com">🤖</a>

<a class="link" href="https://gemini.google.com">💎</a>

<a class="link" href="https://netflix.com">🎬</a>

<a class="link" href="https://twitch.tv">🟣</a>

<a class="link" href="https://amazon.de">📦</a>

<a class="link" href="https://github.com">💻</a>

</div>

<script>

function updateGreeting(){
const hour = new Date().getHours();

let text;

if(hour < 6){
text = "Gute Nacht Kilian 🌙";
}
else if(hour < 12){
text = "Guten Morgen Kilian ☀️";
}
else if(hour < 17){
text = "Guten Mittag Kilian 🌤️";
}
else if(hour < 22){
text = "Guten Abend Kilian 🌆";
}
else{
text = "Gute Nacht Kilian 🌙";
}

document.getElementById("greeting").innerHTML = text;
}

function updateClock(){
const now = new Date();

const time =
now.toLocaleTimeString("de-DE");

document.getElementById("clock").innerHTML = time;
}

updateGreeting();
updateClock();

setInterval(updateClock,1000);
setInterval(updateGreeting,60000);

document.getElementById("searchInput")
.addEventListener("keydown",e=>{

if(e.key==="Enter"){

const query =
encodeURIComponent(e.target.value);

window.location.href =
"https://www.google.com/search?q="+query;

}
});

function detectBrowser(){

const ua = navigator.userAgent;

let browser = "Unbekannt";

if(ua.includes("Edg")){
browser="Microsoft Edge";
}
else if(ua.includes("Chrome")){
browser="Google Chrome";
}
else if(ua.includes("Firefox")){
browser="Mozilla Firefox";
}
else if(ua.includes("Safari")){
browser="Safari";
}

document.getElementById("browser")
.innerHTML = "🌐 "+browser;
}

detectBrowser();

async function getWeather(){

try{

const response = await fetch(
"https://wttr.in/?format=j1"
);

const data = await response.json();

const temp =
data.current_condition[0].temp_C;

const desc =
data.current_condition[0]
.weatherDesc[0].value;

document.getElementById("weather")
.innerHTML =
`🌡️ ${temp}°C · ${desc}`;

}catch{

document.getElementById("weather")
.innerHTML =
"🌤️ Wetter nicht verfügbar";

}
}

getWeather();

</script>

</body>
</html>
