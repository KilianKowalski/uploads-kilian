<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startseite | Kilian</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Grundlegendes Styling & Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            /* Edler, dezenter dunkelgrüner Gradient */
            background: linear-gradient(135deg, #060a07 0%, #0b130f 50%, #102219 100%);
            color: #f3f4f6;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            overflow: hidden;
            
            /* Die neue "Enthüllungs"-Animation beim Laden */
            opacity: 0;
            filter: blur(20px);
            transform: scale(1.02);
            clip-path: inset(10% 15% 10% 15% round 40px);
            animation: epicReveal 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Animation: Seite entblößt sich fließend aus der Mitte heraus */
        @keyframes epicReveal {
            to {
                opacity: 1;
                filter: blur(0);
                transform: scale(1);
                clip-path: inset(0% 0% 0% 0% round 0px);
            }
        }

        /* Glassmorphism Komponenten */
        .glass-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 15px 25px;
            box-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.4);
        }

        /* Top Bar (Uhrzeit & Wetter) */
        .top-bar {
            display: flex;
            justify-content: flex-start;
            width: 100%;
        }

        .info-left {
            display: flex;
            flex-direction: column;
            gap: 6px;
            border-color: rgba(16, 185, 129, 0.1); /* Minimaler grüner Touch am Rand */
        }

        .time-display {
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: #e2e8f0;
        }

        .weather-display {
            font-size: 0.95rem;
            color: #a7f3d0; /* Leicht grünlicher Text fürs Wetter */
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Center Content (Begrüßung & Suche) */
        .main-content {
            text-align: center;
            max-width: 680px;
            width: 100%;
            margin: 0 auto;
            transform: translateY(-30px);
        }

        .greeting {
            font-size: 3.8rem;
            font-weight: 700;
            margin-bottom: 30px;
            /* Verlauf passend zum neuen Design */
            background: linear-gradient(to right, #ffffff, #a7f3d0, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 30px rgba(0,0,0,0.15);
        }

        /* Suchleiste */
        .search-form {
            width: 100%;
        }

        .search-container {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .search-icon {
            position: absolute;
            left: 24px;
            font-size: 1.3rem;
            color: #4285F4;
        }

        .search-input {
            width: 100%;
            padding: 20px 25px 20px 70px;
            font-size: 1.15rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50px;
            color: #fff;
            outline: none;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        /* Smooth Fokus-Effekt mit leicht grünem Glow */
        .search-input:focus {
            background: rgba(255, 255, 255, 0.06);
            border-color: #34d399;
            box-shadow: 0 0 40px rgba(52, 211, 153, 0.25);
            transform: scale(1.02);
        }

        /* Bottom Bar (Shortcuts) */
        .shortcuts-container {
            display: flex;
            justify-content: center;
            gap: 22px;
            flex-wrap: wrap;
        }

        .shortcut-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100px;
            height: 100px;
            text-decoration: none;
            color: #94a3b8;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .shortcut-card:hover {
            transform: translateY(-10px);
            color: #ffffff;
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(52, 211, 153, 0.3);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
        }

        .shortcut-card i {
            font-size: 2rem;
            margin-bottom: 8px;
            transition: transform 0.3s ease;
        }

        .shortcut-card:hover i {
            transform: scale(1.1);
        }

        .shortcut-card span {
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        
        /* Farb-Azentuierung bei Hover */
        .shortcut-card:hover .fa-youtube { color: #ff0000; }
        .shortcut-card:hover .fa-robot { color: #10a37f; }
        .shortcut-card:hover .fa-wand-magic-sparkles { color: #a855f7; }
        .shortcut-card:hover .fa-film { color: #e50914; }
        .shortcut-card:hover .fa-twitch { color: #9146ff; }
        .shortcut-card:hover .fa-amazon { color: #ff9900; }
        .shortcut-card:hover .fa-github { color: #ffffff; }

    </style>
</head>
<body>

    <div class="top-bar">
        <div class="info-left glass-card">
            <div class="time-display" id="clock">00:00:00</div>
            <div class="weather-display" id="weather"><i class="fa-solid fa-cloud-sun"></i> Lade Wetter...</div>
        </div>
    </div>

    <div class="main-content">
        <h1 class="greeting" id="greeting">Hallo Kilian</h1>
        
        <form action="https://www.google.com/search" method="GET" class="search-form">
            <div class="search-container">
                <i class="fa-brands fa-google search-icon"></i>
                <input type="text" name="q" class="search-input" placeholder="Mit Google suchen..." autofocus autocomplete="off">
            </div>
        </form>
    </div>

    <div class="shortcuts-container">
        <a href="https://www.youtube.com" class="shortcut-card glass-card">
            <i class="fa-brands fa-youtube"></i>
            <span>YouTube</span>
        </a>
        <a href="https://chatgpt.com" class="shortcut-card glass-card">
            <i class="fa-solid fa-robot"></i>
            <span>ChatGPT</span>
        </a>
        <a href="https://gemini.google.com" class="shortcut-card glass-card">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            <span>Gemini</span>
        </a>
        <a href="https://www.netflix.com" class="shortcut-card glass-card">
            <i class="fa-solid fa-film"></i>
            <span>Netflix</span>
        </a>
        <a href="https://www.twitch.tv" class="shortcut-card glass-card">
            <i class="fa-brands fa-twitch"></i>
            <span>Twitch</span>
        </a>
        <a href="https://www.amazon.de" class="shortcut-card glass-card">
            <i class="fa-brands fa-amazon"></i>
            <span>Amazon</span>
        </a>
        <a href="https://github.com" class="shortcut-card glass-card">
            <i class="fa-brands fa-github"></i>
            <span>GitHub</span>
        </a>
    </div>

    <script>
        // 1. Live Uhrzeit & Dynamische Begrüßung
        function updateTimeAndGreeting() {
            const now = new Date();
            
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').innerText = `${hours}:${minutes}:${seconds}`;
            
            const currentHour = now.getHours();
            let greetingText = "Hallo Kilian";

            if (currentHour >= 5 && currentHour < 12) {
                greetingText = "Guten Morgen, Kilian";
            } else if (currentHour >= 12 && currentHour < 14) {
                greetingText = "Guten Mittag, Kilian";
            } else if (currentHour >= 14 && currentHour < 18) {
                greetingText = "Guten Nachmittag, Kilian";
            } else if (currentHour >= 18 && currentHour < 23) {
                greetingText = "Guten Abend, Kilian";
            } else {
                greetingText = "Gute Nacht, Kilian";
            }
            
            document.getElementById('greeting').innerText = greetingText;
        }
        setInterval(updateTimeAndGreeting, 1000);
        updateTimeAndGreeting();

        // 2. Wetter-Abfrage via Geolocation
        function getWeather() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    
                    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`)
                        .then(response => response.json())
                        .then(data => {
                            const temp = Math.round(data.current_weather.temperature);
                            document.getElementById('weather').innerHTML = `<i class="fa-solid fa-temperature-half"></i> ${temp}°C`;
                        })
                        .catch(() => {
                            document.getElementById('weather').innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> Wetter N/A`;
                        });
                }, () => {
                    document.getElementById('weather').innerHTML = `<i class="fa-solid fa-location-dot"></i> Standort blockiert`;
                });
            } else {
                document.getElementById('weather').innerHTML = `Nicht unterstützt`;
            }
        }
        getWeather();
    </script>
</body>
</html>
