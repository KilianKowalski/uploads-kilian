<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startseite | Kilian</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Grundlegendes Styling & Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0b0f19 0%, #111827 50%, #1e1b4b 100%);
            color: #f3f4f6;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
            overflow: hidden;
            
            /* Die "richtig geile" Start-Animation */
            opacity: 0;
            transform: scale(0.96);
            filter: blur(10px);
            animation: ultraReveal 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes ultraReveal {
            to {
                opacity: 1;
                transform: scale(1);
                filter: blur(0);
            }
        }

        /* Glassmorphism Komponenten */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 24px;
            padding: 15px 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        /* Top Bar (Uhrzeit, Wetter & Browser) */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }

        .info-left {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .time-display {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: #e2e8f0;
        }

        .weather-display {
            font-size: 0.95rem;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .browser-box {
            font-size: 0.9rem;
            color: #a5b4fc;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            border-color: rgba(165, 180, 252, 0.2);
        }

        /* Center Content (Begrüßung & Suche) */
        .main-content {
            text-align: center;
            max-width: 650px;
            width: 100%;
            margin: 0 auto;
            transform: translateY(-20px);
        }

        .greeting {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 25px;
            background: linear-gradient(to right, #ffffff, #c7d2fe, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        /* Suchleiste */
        .search-form {
            width: 100%;
            position: relative;
        }

        .search-container {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .search-icon {
            position: absolute;
            left: 24px;
            font-size: 1.3rem;
            color: #4285F4; /* Google Blau */
        }

        .search-input {
            width: 100%;
            padding: 18px 25px 18px 65px;
            font-size: 1.1rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px; /* Schön abgerundet */
            color: #fff;
            outline: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
        }

        /* Smooth Animation beim Anklicken der Suchleiste */
        .search-input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: #6366f1;
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.3);
            transform: scale(1.03);
        }

        /* Bottom Bar (Shortcuts) */
        .shortcuts-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .shortcut-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 95px;
            height: 95px;
            text-decoration: none;
            color: #94a3b8;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Hover-Effekt für die Icons (Abtauchen/Leuchten) */
        .shortcut-card:hover {
            transform: translateY(-8px);
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.2);
        }

        .shortcut-card i {
            font-size: 1.8rem;
            margin-bottom: 8px;
            transition: transform 0.3s ease;
        }

        .shortcut-card:hover i {
            transform: scale(1.1);
        }

        .shortcut-card span {
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        
        /* Spezifische Icon-Farben beim Hover für den Premium-Look */
        .shortcut-card:hover .fa-youtube { color: #ff0000; }
        .shortcut-card:hover .fa-robot { color: #10a37f; } /* ChatGPT */
        .shortcut-card:hover .fa-wand-magic-sparkles { color: #7e22ce; } /* Gemini */
        .shortcut-card:hover .fa-netflix { color: #e50914; }
        .shortcut-card:hover .fa-twitch { color: #9146ff; }
        .shortcut-card:hover .fa-amazon { color: #ff9900; }
        .shortcut-card:hover .fa-github { color: #ffffff; }

    </style>
</head>
<body>

    <div class="top-bar">
        <div class="info-left glass-card">
            <div class="time-display" id="clock">00:00:00</div>
            <div class="weather-display" id="weather"><i class="fa-solid fa-cloud-sun"></i> Lade Wetter...</div>
        </div>
        
        <div class="browser-box glass-card" id="browser-box">
            <i class="fa-solid fa-compass"></i> Erkennen...
        </div>
    </div>

    <div class="main-content">
        <h1 class="greeting" id="greeting">Hallo Kilian</h1>
        
        <form action="https://www.google.com/search" method="GET" class="search-form">
            <div class="search-container">
                <i class="fa-brands fa-google search-icon"></i>
                <input type="text" name="q" class="search-input" placeholder="Mit Google suchen..." autofocus autocomplete="off">
            </div>
        </form>
    </div>

    <div class="shortcuts-container">
        <a href="https://www.youtube.com" class="shortcut-card glass-card">
            <i class="fa-brands fa-youtube"></i>
            <span>YouTube</span>
        </a>
        <a href="https://chatgpt.com" class="shortcut-card glass-card">
            <i class="fa-solid fa-robot"></i>
            <span>ChatGPT</span>
        </a>
        <a href="https://gemini.google.com" class="shortcut-card glass-card">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            <span>Gemini</span>
        </a>
        <a href="https://www.netflix.com" class="shortcut-card glass-card">
            <i class="fa-solid fa-film"></i>
            <span>Netflix</span>
        </a>
        <a href="https://www.twitch.tv" class="shortcut-card glass-card">
            <i class="fa-brands fa-twitch"></i>
            <span>Twitch</span>
        </a>
        <a href="https://www.amazon.de" class="shortcut-card glass-card">
            <i class="fa-brands fa-amazon"></i>
            <span>Amazon</span>
        </a>
        <a href="https://github.com" class="shortcut-card glass-card">
            <i class="fa-brands fa-github"></i>
            <span>GitHub</span>
        </a>
    </div>

    <script>
        // 1. Live Uhrzeit & Dynamische Begrüßung
        function updateTimeAndGreeting() {
            const now = new Date();
            
            // Uhrzeit formatieren (immer zweistellig)
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').innerText = `${hours}:${minutes}:${seconds}`;
            
            // Begrüßung basierend auf Stunden anpassen
            const currentHour = now.getHours();
            let greetingText = "Hallo Kilian";

            if (currentHour >= 5 && currentHour < 12) {
                greetingText = "Guten Morgen, Kilian";
            } else if (currentHour >= 12 && currentHour < 14) {
                greetingText = "Guten Mittag, Kilian";
            } else if (currentHour >= 14 && currentHour < 18) {
                greetingText = "Guten Nachmittag, Kilian";
            } else if (currentHour >= 18 && currentHour < 23) {
                greetingText = "Guten Abend, Kilian";
            } else {
                greetingText = "Gute Nacht, Kilian";
            }
            
            document.getElementById('greeting').innerText = greetingText;
        }
        // Intervall auf 1 Sekunde setzen
        setInterval(updateTimeAndGreeting, 1000);
        updateTimeAndGreeting(); // Sofortiger Aufruf beim Laden


        // 2. Browser-Erkennung
        function detectBrowser() {
            const userAgent = navigator.userAgent;
            let browserName = "Unbekannter Browser";
            
            if (userAgent.match(/chrome|chromium|crios/i) && !userAgent.match(/edg/i)) {
                browserName = "Google Chrome";
            } else if (userAgent.match(/firefox|fxios/i)) {
                browserName = "Mozilla Firefox";
            } else if (userAgent.match(/safari/i) && !userAgent.match(/chrome/i)) {
                browserName = "Apple Safari";
            } else if (userAgent.match(/edg/i)) {
                browserName = "Microsoft Edge";
            } else if (userAgent.match(/opr\//i)) {
                browserName = "Opera";
            }
            
            document.getElementById('browser-box').innerHTML = `<i class="fa-solid fa-compass"></i> ${browserName}`;
        }
        detectBrowser();


        // 3. Wetter-Abfrage (Kostenlose Open-Meteo API über Geolocation)
        function getWeather() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    
                    // API-Abruf für aktuelle Temperatur
                    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`)
                        .then(response => response.json())
                        .then(data => {
                            const temp = Math.round(data.current_weather.temperature);
                            document.getElementById('weather').innerHTML = `<i class="fa-solid fa-temperature-half"></i> ${temp}°C`;
                        })
                        .catch(() => {
                            document.getElementById('weather').innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> Wetter N/A`;
                        });
                }, () => {
                    // Falls der User den Standort ablehnt
                    document.getElementById('weather').innerHTML = `<i class="fa-solid fa-location-dot"></i> Standort blockiert`;
                });
            } else {
                document.getElementById('weather').innerHTML = `Nicht unterstützt`;
            }
        }
        getWeather();
    </script>
</body>
</html>
