<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startseite | Kilian</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3Context-menu%3E%3Ccircle cx='50' cy='50' r='40' fill='%23404040'/%3E%3C/svg%3E">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            /* Angenehmes, dunkles Anthrazit-Grau */
            background: linear-gradient(135deg, #111413 0%, #161a18 50%, #1c221f 100%);
            color: #e2e8f0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            overflow: hidden;
            
            opacity: 0;
            filter: blur(20px);
            transform: scale(1.02);
            clip-path: inset(10% 15% 10% 15% round 40px);
            animation: epicReveal 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes epicReveal {
            to {
                opacity: 1;
                filter: blur(0);
                transform: scale(1);
                clip-path: inset(0% 0% 0% 0% round 0px);
            }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            /* Sichtbare Rahmen mit dezentem grünem Touch */
            border: 1px solid rgba(52, 211, 153, 0.15);
            border-radius: 24px;
            padding: 20px 30px;
            box-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.4);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        .weather-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
            width: 350px;
        }

        .info-left {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }

        .time-display {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: #e2e8f0;
        }

        .weather-display {
            font-size: 1.1rem;
            color: #34d399; /* Schönes, klares Grün */
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: color 0.2s;
        }
        
        .weather-display:hover {
            color: #ffffff;
        }

        .weather-sub {
            font-size: 0.85rem;
            color: #94a3b8;
            display: flex;
            gap: 12px;
        }

        .weather-search-box {
            display: none;
            flex-direction: column;
            width: 100%;
            background: rgba(22, 26, 24, 0.98);
            border: 1px solid rgba(52, 211, 153, 0.4);
            border-radius: 16px;
            padding: 10px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            position: absolute;
            top: 0;
            left: 0;
        }

        .weather-search-box input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }
        
        .weather-search-box input:focus {
            border-color: #34d399;
        }

        .search-results {
            max-height: 200px;
            overflow-y: auto;
            margin-top: 8px;
            list-style: none;
        }

        .search-results li {
            padding: 10px;
            font-size: 0.85rem;
            color: #cbd5e1;
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .search-results li:hover {
            background: rgba(52, 211, 153, 0.2);
            color: #fff;
        }

        .close-search {
            align-self: flex-end;
            font-size: 0.8rem;
            color: #94a3b8;
            cursor: pointer;
            margin-bottom: 6px;
        }
        .close-search:hover { color: #fff; }

        .slideshow-container {
            width: 320px;
            height: 200px;
            padding: 0;
            overflow: hidden;
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 12px 45px 0 rgba(0, 0, 0, 0.45);
        }

        .slideshow-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 28px;
            opacity: 1;
            transition: opacity 0.8s ease-in-out;
        }

        .main-content {
            text-align: center;
            max-width: 680px;
            width: 100%;
            margin: 0 auto;
            transform: translateY(-10px);
        }

        .greeting {
            font-size: 3.8rem;
            font-weight: 700;
            margin-bottom: 30px;
            background: linear-gradient(to right, #ffffff, #a7f3d0, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 30px rgba(0,0,0,0.15);
        }

        .search-form {
            width: 100%;
        }

        .search-container {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .search-icon {
            position: absolute;
            left: 24px;
            font-size: 1.3rem;
            color: #4285F4;
        }

        .search-input {
            width: 100%;
            padding: 20px 25px 20px 70px;
            font-size: 1.15rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50px;
            color: #fff;
            outline: none;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .search-input:focus {
            background: rgba(255, 255, 255, 0.06);
            border-color: #34d399;
            box-shadow: 0 0 40px rgba(52, 211, 153, 0.25);
            transform: scale(1.02);
        }

        .shortcuts-container {
            display: flex;
            justify-content: center;
            gap: 22px;
            flex-wrap: wrap;
        }

        .shortcut-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100px;
            height: 100px;
            text-decoration: none;
            color: #94a3b8;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .shortcut-card:hover {
            transform: translateY(-10px);
            color: #ffffff;
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(52, 211, 153, 0.4);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
        }

        .shortcut-card i {
            font-size: 2rem;
            margin-bottom: 8px;
            transition: transform 0.3s ease;
        }

        .shortcut-card:hover i {
            transform: scale(1.1);
        }

        .shortcut-card span {
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        
        .shortcut-card:hover .fa-youtube { color: #ff0000; }
        .shortcut-card:hover .fa-robot { color: #10a37f; }
        .shortcut-card:hover .fa-wand-magic-sparkles { color: #a855f7; }
        .shortcut-card:hover .fa-film { color: #e50914; }
        .shortcut-card:hover .fa-twitch { color: #9146ff; }
        .shortcut-card:hover .fa-amazon { color: #ff9900; }
        .shortcut-card:hover .fa-github { color: #ffffff; }

    </style>
</head>
<body>

    <div class="top-bar">
        <div class="weather-container">
            <div class="info-left glass-card" id="weather-card">
                <div class="time-display" id="clock">00:00:00</div>
                <div class="weather-display" id="weather-main" onclick="openWeatherSearch()">
                    <i class="fa-solid fa-spinner fa-spin"></i> Lade Wetter...
                </div>
                <div class="weather-sub" id="weather-sub"></div>
            </div>

            <div class="weather-search-box" id="weather-search-box">
                <span class="close-search" onclick="closeWeatherSearch()"><i class="fa-solid fa-xmark"></i> Schließen</span>
                <input type="text" id="weather-search-input" placeholder="Ort eingeben (z.B. Ulm)..." autocomplete="off">
                <ul class="search-results" id="search-results"></ul>
            </div>
        </div>

        <div class="slideshow-container glass-card">
            <img id="slideshow-img" src="pics/1.jpg" onerror="this.style.display='none';" alt="Diashow">
        </div>
    </div>

    <div class="main-content">
        <h1 class="greeting" id="greeting">Hallo Kilian</h1>
        
        <form action="https://www.google.com/search" method="GET" class="search-form">
            <div class="search-container">
                <i class="fa-brands fa-google search-icon"></i>
                <input type="text" name="q" class="search-input" placeholder="Mit Google suchen..." autofocus autocomplete="off">
            </div>
        </form>
    </div>

    <div class="shortcuts-container">
        <a href="https://www.youtube.com" class="shortcut-card glass-card">
            <i class="fa-brands fa-youtube"></i>
            <span>YouTube</span>
        </a>
        <a href="https://chatgpt.com" class="shortcut-card glass-card">
            <i class="fa-solid fa-robot"></i>
            <span>ChatGPT</span>
        </a>
        <a href="https://gemini.google.com" class="shortcut-card glass-card">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            <span>Gemini</span>
        </a>
        <a href="https://www.netflix.com" class="shortcut-card glass-card">
            <i class="fa-solid fa-film"></i>
            <span>Netflix</span>
        </a>
        <a href="https://www.twitch.tv" class="shortcut-card glass-card">
            <i class="fa-brands fa-twitch"></i>
            <span>Twitch</span>
        </a>
        <a href="https://www.amazon.de" class="shortcut-card glass-card">
            <i class="fa-brands fa-amazon"></i>
            <span>Amazon</span>
        </a>
        <a href="https://github.com" class="shortcut-card glass-card">
            <i class="fa-brands fa-github"></i>
            <span>GitHub</span>
        </a>
    </div>

    <script>
        function updateTimeAndGreeting() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').innerText = `${hours}:${minutes}:${seconds}`;
            
            const currentHour = now.getHours();
            let greetingText = "Hallo Kilian";

            if (currentHour >= 5 && currentHour < 12) { greetingText = "Guten Morgen, Kilian"; }
            else if (currentHour >= 12 && currentHour < 14) { greetingText = "Guten Mittag, Kilian"; }
            else if (currentHour >= 14 && currentHour < 18) { greetingText = "Guten Nachmittag, Kilian"; }
            else if (currentHour >= 18 && currentHour < 23) { greetingText = "Guten Abend, Kilian"; }
            else { greetingText = "Gute Nacht, Kilian"; }
            
            document.getElementById('greeting').innerText = greetingText;
        }
        setInterval(updateTimeAndGreeting, 1000);
        updateTimeAndGreeting();

        let searchTimeout;
        const searchBox = document.getElementById('weather-search-box');
        const searchInput = document.getElementById('weather-search-input');
        const resultsList = document.getElementById('search-results');

        function openWeatherSearch() {
            searchBox.style.display = 'flex';
            searchInput.focus();
        }

        function closeWeatherSearch() {
            searchBox.style.display = 'none';
            searchInput.value = '';
            resultsList.innerHTML = '';
        }

        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimeout);
            const query = searchInput.value.trim();
            if (query.length < 2) {
                resultsList.innerHTML = '';
                return;
            }

            searchTimeout = setTimeout(() => {
                fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&addressdetails=1&limit=5&accept-language=de`)
                    .then(res => res.json())
                    .then(data => {
                        resultsList.innerHTML = '';
                        data.forEach(place => {
                            const li = document.createElement('li');
                            const city = place.address.city || place.address.town || place.address.village || place.address.state_district || place.name;
                            const state = place.address.state || '';
                            const country = place.address.country === 'Deutschland' ? '' : `, ${place.address.country}`;
                            const displayName = `${city} (${state}${country})`;

                            li.textContent = displayName;
                            li.onclick = () => selectLocation(place.lat, place.lon, city);
                            resultsList.appendChild(li);
                        });
                    })
                    .catch(() => {});
            }, 400);
        });

        function selectLocation(lat, lon, name) {
            localStorage.setItem('weather_lat', lat);
            localStorage.setItem('weather_lon', lon);
            localStorage.setItem('weather_name', name);
            fetchWeatherData(lat, lon, name);
            closeWeatherSearch();
        }

        function fetchWeatherData(lat, lon, name) {
            fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&hourly=precipitation_probability,uv_index&timezone=auto`)
                .then(response => response.json())
                .then(data => {
                    const current = data.current;
                    const temp = Math.round(current.temperature_2m);
                    const code = current.weather_code;
                    
                    const currentHour = new Date().getHours();
                    const rainProb = data.hourly.precipitation_probability[currentHour] !== undefined ? data.hourly.precipitation_probability[currentHour] : 0;
                    const uvIndex = data.hourly.uv_index[currentHour] !== undefined ? Math.round(data.hourly.uv_index[currentHour]) : 0;
                    
                    let condition = "Unbekannt";
                    let icon = "fa-cloud";

                    if (code === 0) { condition = "Klar"; icon = "fa-sun"; }
                    else if ([1, 2, 3].includes(code)) { condition = "Bewölkt"; icon = "fa-cloud-sun"; }
                    else if ([45, 48].includes(code)) { condition = "Nebel"; icon = "fa-smog"; }
                    else if ([51, 53, 55].includes(code)) { condition = "Nieselregen"; icon = "fa-cloud-rain"; }
                    else if ([61, 63, 65, 80, 81, 82].includes(code)) { condition = "Regen"; icon = "fa-cloud-showers-heavy"; }
                    else if ([71, 73, 75, 85, 86].includes(code)) { condition = "Schnee"; icon = "fa-snowflake"; }
                    else if ([95, 96, 99].includes(code)) { condition = "Gewitter"; icon = "fa-cloud-bolt"; }

                    document.getElementById('weather-main').innerHTML = `<i class="fa-solid ${icon}"></i> ${name} · ${temp}°C · ${condition}`;
                    document.getElementById('weather-sub').innerHTML = `<span><i class="fa-solid fa-umbrella"></i> ${rainProb}% Regen</span> <span><i class="fa-solid fa-sun"></i> UV: ${uvIndex}</span>`;
                })
                .catch(() => {
                    document.getElementById('weather-main').innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> Wetter-Fehler`;
                });
        }

        function loadSavedOrCreate() {
            const savedLat = localStorage.getItem('weather_lat');
            const savedLon = localStorage.getItem('weather_lon');
            const savedName = localStorage.getItem('weather_name');

            if (savedLat && savedLon && savedName) {
                fetchWeatherData(savedLat, savedLon, savedName);
            } else {
                document.getElementById('weather-main').innerHTML = `<i class="fa-solid fa-location-dot"></i> Ort festlegen (Klick)`;
                openWeatherSearch();
            }
        }
        loadSavedOrCreate();

        const images = ['pics/1.jpg', 'pics/2.jpg', 'pics/3.jpg', 'pics/4.jpg', 'pics/5.jpg', 'pics/6.jpg', 'pics/7.jpg', 'pics/8.jpg', 'pics/9.jpg', 'pics/10.jpg', 'pics/11.jpg', 'pics/12.jpg', 'pics/13.jpg'];
        let imgIndex = 0;
        const imgElement = document.getElementById('slideshow-img');

        function changeImage() {
            if (images.length === 0) return;
            imgElement.style.opacity = 0;
            setTimeout(() => {
                imgIndex = (imgIndex + 1) % images.length;
                imgElement.src = images[imgIndex];
                imgElement.style.opacity = 1;
            }, 800);
        }
        if(images.length > 0) { setInterval(changeImage, 6000); }
    </script>
</body>
</html>
